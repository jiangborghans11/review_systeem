name: lead-pages-cleanup
# Removes the lead page + its videos of every lead that is afgerond or geen_interesse (and untouched for a week)
# in the SW lead engine (Jiang, 19 Nov 2026): v/<slug>.html and v/media/<slug>-*. The lead engine decides which
# slugs (GET /functions/v1/lead-pages); this only deletes those files, in one commit through the GitHub API (no
# checkout of the 3 GB repo). Vercel deploys the smaller site after the commit.
# One-time setup: repo secret PAGES_CLEANUP_SECRET (same value as the Supabase function secret).
on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alleen laten zien wat weg zou gaan"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: lead-pages-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        env:
          PAGES_CLEANUP_SECRET: ${{ secrets.PAGES_CLEANUP_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const secret = process.env.PAGES_CLEANUP_SECRET;
            if (!secret) return core.setFailed('Secret PAGES_CLEANUP_SECRET ontbreekt');
            const r = await fetch('https://urlpudzyeumiunaireeh.supabase.co/functions/v1/lead-pages', {
              headers: { 'x-pages-secret': secret },
            });
            if (!r.ok) return core.setFailed(`lead-pages: HTTP ${r.status}`);
            const { slugs = [] } = await r.json();
            const SLUG = /^[a-z0-9]+(-[a-z0-9]+)*$/;
            const MEDIA = /^[a-z]+\.(mp4|mov|jpg|jpeg|png|webp)$/; // video.mp4, thumb.jpg, loom.mp4, ...
            const wanted = new Set(slugs.filter((s) => SLUG.test(s)));
            if (!wanted.size) return core.info('Niets op te ruimen.');

            const { owner, repo } = context.repo;
            const branch = 'main';
            const ref = await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` });
            const headSha = ref.data.object.sha;
            const head = await github.rest.git.getCommit({ owner, repo, commit_sha: headSha });
            const tree = await github.rest.git.getTree({ owner, repo, tree_sha: head.data.tree.sha, recursive: 'true' });
            if (tree.data.truncated) return core.setFailed('Tree te groot (truncated): niets verwijderd');

            const remove = [];
            const removed = new Set();
            for (const e of tree.data.tree) {
              if (e.type !== 'blob') continue;
              let m = e.path.match(/^v\/([^/]+)\.html$/);
              if (m && wanted.has(m[1])) { remove.push(e.path); removed.add(m[1]); continue; }
              m = e.path.match(/^v\/media\/([^/]+)$/);
              if (!m) continue;
              for (const slug of wanted) {
                const name = m[1];
                if (name.startsWith(slug + '-') && MEDIA.test(name.slice(slug.length + 1))) {
                  remove.push(e.path); removed.add(slug); break;
                }
              }
            }
            if (!remove.length) return core.info(`${wanted.size} afgesloten leads, hun pagina's zijn al weg.`);
            const leads = [...removed].sort();
            core.info(`${leads.length} leadpagina's, ${remove.length} bestanden:\n` + remove.join('\n'));
            if (process.env.DRY_RUN === 'true') return core.info('Dry run: niets verwijderd.');

            const newTree = await github.rest.git.createTree({
              owner, repo, base_tree: head.data.tree.sha,
              tree: remove.map((path) => ({ path, mode: '100644', type: 'blob', sha: null })),
            });
            const message = `Leadpagina's opgeruimd: ${leads.length} leads (afgerond / geen interesse)\n\n${leads.join(', ')}`;
            const commit = await github.rest.git.createCommit({ owner, repo, message, tree: newTree.data.sha, parents: [headSha] });
            await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false });
            core.info(`Commit ${commit.data.sha.slice(0, 7)}: ${remove.length} bestanden weg.`);
