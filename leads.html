  function sinceOf(p) {
    if (p === 'totaal') return null;
    const d = new Date(); d.setHours(0, 0, 0, 0);
    if (p === 'week') d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); else d.setDate(1);
    return d.toISOString();
  }

  // ───────── badge on the tab: calls due today ─────────
  function badge() {
    const b = $('#apo-badge');
    if (!b) return;
    const end = new Date(); end.setHours(23, 59, 59, 999);
    const due = A.ok ? A.tasks.filter((t) => new Date(t.due_at) <= end).length : 0;
    b.hidden = !due; b.textContent = due;
  }

  // ───────── shell ─────────
  function draw(soft) {
    const root = $('#v-apollo');
    if (!root) return;
    // A background refresh never wipes what you're typing in Instellingen.
    if (soft && A.view === 'instellingen' && root.dataset.view === 'instellingen' && A.ok) return;
    const keepFocus = document.activeElement?.id === 'apo-q';
    const s = A.settings, st = engineState(s);
    const calls = A.tasks.length;
    root.dataset.view = A.view;
    root.innerHTML = `
      <div class="hello apo-head"><h1>${logo()} Apollo</h1>${A.ok ? `<span class="chip st-${st[1]}">${esc(st[0])}</span>` : ''}
        <p style="width:100%">Het tweede kanaal: leads uit Apollo, 5 mails, bellen na een bezoek. Los van de Lead Engine.</p></div>
      ${A.ok === null ? '<div class="card"><div class="skel"></div><div class="skel" style="width:60%"></div></div>'
      : A.ok === false ? `<div class="card apo-off">${logo('apo-logo')}<b>Apollo is nog niet actief</b>De tabellen of functies staan nog niet live. De Lead Engine werkt gewoon door.<br><br><button class="btn" data-apo="reload">${icon('refresh')} Opnieuw proberen</button></div>`
      : `<div class="stabs apo-sub">
          <a href="#apollo/bellen" class="${A.view === 'bellen' ? 'on' : ''}">${icon('phone')} Bellen <span>${calls}</span></a>
          <a href="#apollo/leads" class="${A.view === 'leads' ? 'on' : ''}">${icon('users')} Leads <span>${A.leads.filter((l) => !l.is_test).length}</span></a>
          <a href="#apollo/vergelijking" class="${A.view === 'vergelijking' ? 'on' : ''}">${icon('chart')} Vergelijking</a>
          <a href="#apollo/instellingen" class="${A.view === 'instellingen' ? 'on' : ''}">${icon('gear')} Instellingen</a>
        </div><div id="apo-view"></div>`}`;
    if (!A.ok) return;
    if (A.view === 'bellen') viewCalls();
    if (A.view === 'leads') viewLeads();
    if (A.view === 'vergelijking') viewCompare();
    if (A.view === 'instellingen') viewSettings();
    if (keepFocus) { const i = $('#apo-q'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  }

  // ───────── Bellen ─────────
  function viewCalls() {
    const now = Date.now(), end = new Date(); end.setHours(23, 59, 59, 999);
    const card = (t) => {
      const l = leadById(t.lead_id) || {};
      const late = new Date(t.due_at).getTime() < now - 60 * 60e3;
      const acts = [];
      if (l.phone && !l.phone_missing) {
        acts.push(`<a class="btn apo-primary" href="${tel(l.phone)}">${icon('phone')} ${esc(prettyPhone(l.phone))}</a>`);
        acts.push(`<button class="btn icon" data-copy="${esc(l.phone)}" data-what="Nummer" title="Kopieer nummer">${icon('copy')}</button>`);
      } else {
        acts.push(`<a class="btn" href="${esc(mapsUrl(l))}" target="_blank" rel="noopener">${icon('pin')} Zoek in Google Maps</a>`);
        acts.push(`<button class="btn" data-apo-lead="${l.id}" data-apo-focus="phone">${icon('edit')} Nummer invullen</button>`);
      }
      acts.push(`<button class="btn" data-apo="call" data-id="${l.id}" data-task="${t.id}">${icon('check')} Resultaat</button>`);
      acts.push(`<button class="btn" data-apo="skip" data-task="${t.id}">Overslaan</button>`);
      acts.push(`<button class="btn" data-apo-lead="${l.id}">Bekijk lead</button>`);
      const meta = [leadName(l), l.title, l.city, t.payload?.reason].filter(Boolean).map(esc).join(' · ');
      return `<div class="card task">
        <div class="tic ic apo">${icon('phone')}</div>
        <div><h4>${esc(l.company || '–')} ${scoreChip(l)} ${l.phone_missing || !l.phone ? '<span class="chip st-red">nummer ontbreekt</span>' : ''}${l.is_test ? ' <span class="chip st-grey">test</span>' : ''}</h4>
          <div class="meta">${meta}${meta ? ' · ' : ''}<span class="${late ? 'late' : ''}">${late ? 'sinds ' : ''}${due(t.due_at)}</span>${l.last_visit_at ? ` · bezocht ${rel(l.last_visit_at)}${l.page_views > 1 ? ` (${l.page_views}x)` : ''}` : ''}</div></div>
        <div class="acts">${acts.join('')}</div>
      </div>`;
    };
    const nowList = A.tasks.filter((t) => new Date(t.due_at) <= end), later = A.tasks.filter((t) => new Date(t.due_at) > end);
    let html = '';
    if (nowList.length) html += `<div class="tgroup"><h3>Vandaag · ${nowList.length}</h3>${nowList.map(card).join('')}</div>`;
    if (later.length) html += `<div class="tgroup"><h3>Later · ${later.length}</h3>${later.map(card).join('')}</div>`;
    if (!A.tasks.length) html = `<div class="card empty">${icon('check')}<b>Niemand om te bellen</b>Alleen leads die hun pagina bekeken komen hier, de dag zelf of de dag erna (nooit za, zo of ma).</div>`;
    $('#apo-view').innerHTML = html;
  }

  // ───────── Leads ─────────
  function filtered() {
    let list = A.leads.slice();
    const q = A.q.trim().toLowerCase(), tk = telKey(q);
    if (q) list = list.filter((l) => [l.company, l.first_name, l.last_name, l.email, l.city, l.domain, l.phone].some((v) => v && String(v).toLowerCase().includes(q))
      || (tk.length >= 4 && l.phone && telKey(l.phone).includes(tk)));
    if (A.score) list = list.filter((l) => (A.score === '-' ? !l.score : l.score === A.score));
    const far = 8.64e15, t = (v) => (v ? new Date(v).getTime() : null);
    if (A.sort === 'next') list.sort((a, b) => ((t(a.next_send_at) ?? far) - (t(b.next_send_at) ?? far)) || a.company.localeCompare(b.company, 'nl'));
    if (A.sort === 'visit') list.sort((a, b) => (t(b.last_visit_at) ?? -far) - (t(a.last_visit_at) ?? -far));
    if (A.sort === 'score') list.sort((a, b) => (a.score || 'Z').localeCompare(b.score || 'Z') || (a.import_order - b.import_order));
    if (A.sort === 'name') list.sort((a, b) => a.company.localeCompare(b.company, 'nl'));
    return list;
  }
  function viewLeads() {
    const all = filtered(), g = GROUPS.find((x) => x.id === A.group);
    const list = g ? all.filter((l) => inGroup(g, l)) : all;
    const tabs = [`<button data-apo-group="" class="${!g ? 'on' : ''}">Alles <span>${all.length}</span></button>`]
      .concat(GROUPS.map((x) => `<button data-apo-group="${x.id}" class="${g?.id === x.id ? 'on' : ''}">${x.title} <span>${all.filter((l) => inGroup(x, l)).length}</span></button>`)).join('');
    const rows = list.map((l) => `<tr data-apo-lead="${l.id}">
        <td class="co"><b>${esc(l.company)}${l.is_test ? ' <span class="chip st-grey">test</span>' : ''}${l.phone_missing ? ` <span class="chip st-red" title="Nummer ontbreekt">${icon('phone')}</span>` : ''}${needsPersonal(l) ? ` <span class="chip st-apo" title="${esc(l.personal_error ? `Geen persoonlijke zin: ${l.personal_error}` : 'Nog geen persoonlijke zin: mail 1 wacht')}">geen zin</span>` : ''}</b><div>${esc([leadName(l), l.city].filter(Boolean).join(' · ') || l.email || '')}</div></td>
        <td>${achip(l.status)}</td>
        <td>${scoreChip(l)}</td>
        <td>${stepChip(l)}</td>
        <td><span class="sig num ${l.page_views ? 'on' : ''}" style="${l.page_views ? 'color:var(--apo)' : ''}" title="Pagina ${l.page_views || 0}x bekeken">${icon('eye')} ${l.page_views || 0}</span></td>
        <td>${l.next_send_at && RUNNING.includes(l.status) ? due(l.next_send_at) : '<span class="faint">–</span>'}</td>
        <td class="muted small">${esc((l.sender_email || '').split('@')[0] || '–')}</td>
      </tr>`).join('');
    $('#apo-view').innerHTML = `
      <div class="toolbar">
        <label class="search">${icon('search')}<input id="apo-q" type="search" placeholder="Zoek op bedrijf, naam, plaats, telefoon…" value="${esc(A.q)}"></label>
        <select class="sel" id="apo-score" aria-label="Score">${[['', 'Alle scores'], ['A', 'Score A'], ['B', 'Score B'], ['C', 'Score C'], ['-', 'Zonder score']].map(([v, t]) => `<option value="${v}" ${A.score === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <select class="sel" id="apo-sort" aria-label="Sorteer">${[['next', 'Volgende mail'], ['visit', 'Laatst bezocht'], ['score', 'Score'], ['name', 'Naam']].map(([v, t]) => `<option value="${v}" ${A.sort === v ? 'selected' : ''}>${t}</option>`).join('')}</select>
      </div>
      <div class="stabs">${tabs}</div>
      <div class="card tablewrap">${list.length ? `<table>
        <thead><tr><th>Bedrijf</th><th>Status</th><th>Score</th><th>Stap</th><th>Bezoek</th><th>Volgende mail</th><th>Mailbox</th></tr></thead>
        <tbody>${rows}</tbody></table>` : `<div class="empty"><b>Geen leads</b>${A.leads.length ? 'Niks gevonden met dit filter.' : 'Importeer een CSV uit Apollo bij Instellingen.'}</div>`}</div>`;
  }

  // ───────── Lead panel ─────────
  function describeEv(e) {
    const d = e.data || {};
    switch (e.type) {
      case 'sent': return [`Mail ${d.step || ''} verstuurd${d.from ? ` vanaf ${d.from}` : ''}`, 'send', 'apo'];
      case 'reply': return [`Reactie${d.snippet ? `: ${d.snippet}` : ''}`, 'reply', 'orange'];
      case 'bounce': return ['Mail kwam niet aan', 'alert', 'red'];
      case 'unsubscribe': return ['Afgemeld', 'hand', 'red'];
      case 'page_view': return ['Pagina bekeken', 'eye', 'apo'];
      case 'video_play': return ['Video gestart', 'play', 'green'];
      case 'video_50': return ['Video half bekeken', 'play', 'green'];
      case 'video_end': return ['Video helemaal bekeken', 'check', 'green'];
      case 'plan_open': return ['Planner geopend', 'cal', 'green'];
      case 'call_logged': return [`Gebeld: ${OUTCOME_LABEL[d.outcome] || String(d.outcome || '').replace(/_/g, ' ')}${d.at ? ` · ${fFull.format(new Date(d.at))}` : ''}${d.note ? ` · ${d.note}` : ''}`, 'phone', 'blue'];
      case 'status_change': return [`Status → ${STATUS_A[d.to]?.[0] || d.to || ''}`, 'status', 'grey'];
      case 'intake': return [`Intake ingepland${d.at || d.meeting_at ? `: ${fFull.format(new Date(d.at || d.meeting_at))}` : ''}`, 'cal', 'green'];
      case 'note': return [`Notitie: ${d.text || ''}`, 'note', 'grey'];
      case 'import': return ['Geïmporteerd', 'upload', 'grey'];
      default: return [e.type.replace(/_/g, ' '), 'check', 'grey'];
    }
  }

  function head(l) {
    return `<button class="btn icon x" data-apo="close" aria-label="Sluiten">${icon('x')}</button>
      <h2>${esc(l.company)} ${scoreChip(l)}</h2>
      <div class="who">${esc([leadName(l), l.title, l.city].filter(Boolean).join(' · '))}</div>
      <div class="chips">${achip(l.status)} ${stepChip(l)} <span class="chip st-apo">Apollo</span>${l.is_test ? ' <span class="chip st-grey">test</span>' : ''}${l.do_not_contact ? ' <span class="chip st-red">Niet contacteren</span>' : ''}</div>`;
  }

  function body(l, events) {
    const web = href(l.website || l.domain);
    const li = href(l.linkedin);
    const sent = {};
    for (const e of events) if (e.type === 'sent' && e.data?.step) sent[e.data.step] = sent[e.data.step] || e.at;
    const tpl1 = A.templates.find((t) => t.step === 1);
    const seq = [1, 2, 3, 4, 5].map((i) => {
      const done = i <= (l.step || 0);
      const next = !done && i === (l.step || 0) + 1 && l.next_send_at && RUNNING.includes(l.status);
      const txt = done ? `Verstuurd${sent[i] ? ` · ${due(sent[i])}` : ''}${i === 1 && l.subject ? ` · ${l.subject}` : ''}`
        : next ? `Gepland · ${due(l.next_send_at)}` : RUNNING.includes(l.status) ? 'Nog niet' : 'Gaat niet meer';
      return `<div class="${done ? 'done' : next ? 'next' : 'todo'}">${icon(done ? 'check' : next ? 'clock' : 'mail')}<b>Mail ${i}</b><span>${esc(txt)}</span></div>`;
    }).join('');
    const signals = Object.entries(l.score_signals || {}).filter(([, v]) => v !== null && v !== '' && v !== false);
    const sig = (v) => (typeof v === 'boolean' ? '' : typeof v === 'object' ? `: ${JSON.stringify(v)}` : `: ${v}`);
    const notes = events.filter((e) => e.type === 'note');
    const acts = events.filter((e) => e.type !== 'note');
    const stopped = l.status === 'gestopt';
    const canStop = RUNNING.includes(l.status);
    return `
      <div class="quick">
        <a class="btn apo-primary" href="${esc(pageUrl(l))}" target="_blank" rel="noopener">${icon('ext')} Leadpagina</a>
        ${l.phone && !l.phone_missing ? `<a class="btn" href="${tel(l.phone)}">${icon('phone')} Bel</a>` : ''}
        <button class="btn" data-apo="call" data-id="${l.id}">${icon('check')} Belresultaat</button>
        ${canStop ? `<button class="btn danger" data-apo="stop" data-id="${l.id}">${icon('stop')} Stop</button>` : ''}
        ${stopped ? `<button class="btn" data-apo="resume" data-id="${l.id}">${icon('play')} Hervat</button>` : ''}
      </div>
      ${l.reply_snippet ? `<div class="card"><h2>Reactie${l.reply_class ? ` · ${esc(l.reply_class)}` : ''}</h2><div class="reply">${esc(unent(l.reply_snippet))}</div></div>` : ''}
      ${personalCard(l)}
      <div class="card"><h2>Contact</h2><div class="rows">
        ${l.email ? `<div>${icon('mail', 'faint')}<span><a href="mailto:${esc(l.email)}">${esc(l.email)}</a></span></div>` : ''}
        <div>${icon('phone', 'faint')}<span class="apo-phone">
          <input class="apo-in" id="apo-phone" type="tel" value="${esc(l.phone || '')}" placeholder="Nummer invullen" aria-label="Telefoon">
          <button class="btn small" data-apo="phone-save" data-id="${l.id}">Bewaar</button>
          ${l.phone ? `<button class="btn icon" style="padding:3px" data-copy="${esc(l.phone)}" data-what="Nummer" title="Kopieer">${icon('copy')}</button>` : ''}
          ${l.phone_missing ? '<span class="chip st-red">nummer ontbreekt</span>' : ''}</span></div>
        <div>${icon('pin', 'faint')}<span><a href="${esc(mapsUrl(l))}" target="_blank" rel="noopener">Zoek ${esc(l.company)} in Google Maps</a></span></div>
        ${web ? `<div>${icon('globe', 'faint')}<span><a href="${esc(web)}" target="_blank" rel="noopener">${esc(host(l.website || l.domain))}</a></span></div>` : ''}
        ${li ? `<div>${icon('users', 'faint')}<span><a href="${esc(li)}" target="_blank" rel="noopener">LinkedIn</a></span></div>` : ''}
        ${l.employees ? `<div>${icon('users', 'faint')}<span class="muted">${esc(l.employees)} medewerkers</span></div>` : ''}
      </div></div>
      <div class="card"><h2>Score</h2>
        <div class="note-row">${['A', 'B', 'C'].map((s) => `<button class="btn small ${l.score_override === s ? 'apo-primary' : ''}" data-apo="score" data-id="${l.id}" data-score="${s}">${s}</button>`).join('')}
          <button class="btn small ${l.score_override ? '' : 'apo-primary'}" data-apo="score" data-id="${l.id}" data-score="">Automatisch${l.score_auto ? ` (${esc(l.score_auto)})` : ''}</button></div>
        ${signals.length ? `<div class="apo-signals">${signals.map(([k, v]) => `<span class="chip st-grey">${esc(k.replace(/_/g, ' '))}${esc(sig(v))}</span>`).join('')}</div>` : '<p class="small muted" style="margin-top:8px">Nog geen signalen.</p>'}</div>
      <div class="card"><h2>Signalen</h2><div class="rows">
        <div>${icon('eye', 'faint')}<span class="k">Pagina</span><span>${l.page_views ? `${l.page_views}x bekeken · eerst ${rel(l.first_visit_at)} · laatst ${rel(l.last_visit_at)}` : 'Nog niet bekeken'}</span></div>
        ${l.call_attempts ? `<div>${icon('phone', 'faint')}<span class="k">Belpogingen</span><span>${l.call_attempts}${l.call_outcome ? ` · ${esc(OUTCOME_LABEL[l.call_outcome] || l.call_outcome)}` : ''}</span></div>` : ''}
        ${l.sender_email ? `<div>${icon('mail', 'faint')}<span class="k">Mailbox</span><span>${esc(l.sender_email)}</span></div>` : ''}
      </div></div>
      <div class="card"><h2>Sequence <span class="sub">${l.step || 0} van 5${tpl1 ? '' : ''}</span></h2><div class="apo-seq">${seq}</div></div>
      <div class="card"><h2>Notities</h2>
        <form class="note-form" id="apo-note-form" data-id="${l.id}"><textarea id="apo-note-text" rows="2" placeholder="Nieuwe notitie…"></textarea>
          <div class="note-row"><button class="btn apo-primary" type="submit">Toevoegen</button></div></form>
        ${l.notes ? `<div class="note"><div class="note-text">${esc(l.notes)}</div></div>` : ''}
        ${notes.map((e) => `<div class="note"><div class="note-meta">${icon('note')}<span>${due(e.at)}</span></div><div class="note-text">${esc(e.data?.text || '')}</div></div>`).join('') || (l.notes ? '' : '<p class="muted small">Nog geen notities.</p>')}</div>
      <div class="card"><h2>Activiteit</h2><div class="timeline">${acts.length ? acts.map((e) => { const [t, ic, c] = describeEv(e); return `<div class="ev c-${c}"${c === 'apo' ? ' style="--c:var(--apo)"' : ''}>${c === 'apo' ? icon(ic).replace('class="i ', 'style="color:var(--apo)" class="i ') : icon(ic)}<span>${esc(t)}</span><span class="t">${rel(e.at)}</span></div>`; }).join('') : '<p class="muted">Nog geen activiteit.</p>'}</div></div>`;
  }

  /** Mail 1 is always personal: the sentence ({{persoonlijk}}), where it came from, and a way to change it. */
  function personalCard(l) {
    const sent = (l.step || 0) >= 1;
    const facts = Array.isArray(l.personal_facts) ? l.personal_facts.filter((f) => f && (f.fact || f.source)) : [];
    const src = (x) => { const u = href(x); return u && /^https?:\/\//i.test(String(x).trim()) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(host(x))}</a>` : esc(x || ''); };
    return `<div class="card" id="apo-personal-card"><h2>Persoonlijke zin <span class="sub">mail 1</span></h2>
      ${needsPersonal(l) ? `<div class="apo-warn">${icon('alert')}<div><b>Nog geen persoonlijke zin: mail 1 wacht</b>${l.personal_error ? `<span>${esc(l.personal_error)}</span>` : '<span>De engine schrijft hem uit hun website, of vul hem zelf in.</span>'}</div></div>` : ''}
      <textarea class="apo-in apo-personal" id="apo-personal" rows="3" placeholder="1–2 zinnen over ${esc(l.company)}, bijvoorbeeld iets van hun website" aria-label="Persoonlijke zin">${esc(l.personal || '')}</textarea>
      ${facts.length ? `<ul class="apo-facts">${facts.map((f) => `<li><span>${esc(f.fact || '')}${f.source ? ` · ${src(f.source)}` : ''}</span></li>`).join('')}</ul>` : ''}
      <div class="note-row" style="margin-top:8px">
        <button class="btn small apo-primary" data-apo="personal-save" data-id="${l.id}">Bewaar</button>
        ${l.personal ? `<button class="btn small" data-apo="personal-clear" data-id="${l.id}" title="Leegmaken: de engine schrijft een nieuwe">Opnieuw laten schrijven</button>` : ''}
        <span class="faint small">${sent ? 'Zat in mail 1' : l.personal_at ? `Geschreven ${rel(l.personal_at)}` : ''}</span>
      </div></div>`;
  }

  async function openLead(id, focus) {
    const l = leadById(id);
    if (!l) return;
    A.open = id;
    const dr = $('#apo-drawer');
    dr.innerHTML = `<div class="dhead">${head(l)}</div><div class="dbody"><div class="card"><div class="skel"></div><div class="skel" style="width:70%"></div></div></div>`;
    dr.classList.add('open'); $('#scrim').classList.add('open'); dr.scrollTop = 0;
    if (location.hash !== `#apollo/lead/${l.slug}`) history.replaceState(null, '', `#apollo/lead/${l.slug}`);
    const events = await loadEvents(id);
    if (A.open !== id) return;
    dr.querySelector('.dhead').innerHTML = head(leadById(id) || l);
    dr.querySelector('.dbody').innerHTML = body(leadById(id) || l, events);
    if (focus === 'phone') $('#apo-phone')?.focus();
  }
  function closeLead() {
    if (!A.open) return;
    A.open = null;
    $('#apo-drawer').classList.remove('open');
    if (!UI.openLead) $('#scrim').classList.remove('open');
    if (location.hash.startsWith('#apollo/lead/')) history.replaceState(null, '', `#apollo/${A.view}`);
  }
  async function refreshOpen() {
    if (A.open) await openLead(A.open);
    draw();
  }

  function callSheet(l, taskId) {
    const opts = OUTCOMES.map(([k, label], i) => `<label><input type="radio" name="apo_outcome" value="${k}" ${i === 0 ? 'checked' : ''}> ${esc(label)}</label>`).join('');
    sheet(`Belresultaat · ${l.company}`, `<div class="opts">${opts}</div>
      <label class="fld" id="apo-at" hidden><span id="apo-at-label">Wanneer</span><input type="datetime-local" name="at" min="${localInput(new Date())}"></label>
      <label class="fld">Notitie (optioneel)<textarea name="note" rows="2"></textarea></label>`, 'Bewaar', async (form) => {
      const outcome = form.apo_outcome.value, needsAt = OUTCOMES.find((o) => o[0] === outcome)?.[2];
      const at = form.at.value;
      if (needsAt && !at) { toast('Kies de datum en tijd'); form.at.focus(); return false; }
      if (outcome === 'geen_interesse' && !confirm(`${l.company} op Geen interesse? Er gaan geen mails meer naartoe.`)) return false;
      const r = await action('log_call', { lead_id: l.id, outcome, at: needsAt ? new Date(at).toISOString() : undefined, note: form.note.value.trim() || undefined });
      if (!r) return false;
      if (r.lead) putLead(r.lead);

  /** Grouped horizontal bars (inline SVG): per step the Lead Engine (blue) and Apollo (yellow) percentage. */
  function chart(rows) {
    const W = 520, L = 92, R = 46, rowH = 46, H = rows.length * rowH + 6;
    const max = Math.max(5, ...rows.flatMap((r) => [r[1], r[2]]));
    const w = (v) => Math.max(v > 0 ? 3 : 0, ((W - L - R) * v) / max);
    const lab = (v) => `${v >= 10 || v === 0 ? Math.round(v) : (Math.round(v * 10) / 10).toLocaleString('nl-NL')}%`;
    return `<svg class="apo-chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Conversie per stap, Lead Engine tegen Apollo">
      ${rows.map(([t, a, b], i) => {
        const y = i * rowH + 6;
        return `<text x="0" y="${y + 21}">${esc(t)}</text>
          <rect x="${L}" y="${y}" width="${w(a)}" height="15" rx="4" fill="var(--blue)"/><text class="v" x="${L + w(a) + 6}" y="${y + 12}">${lab(a)}</text>
          <rect x="${L}" y="${y + 18}" width="${w(b)}" height="15" rx="4" fill="var(--apo)"/><text class="v" x="${L + w(b) + 6}" y="${y + 30}">${lab(b)}</text>`;
      }).join('')}</svg>`;
  }

  /** Change one key of settings.apollo: read the row fresh first, so keys the engine wrote meanwhile stay. */
  async function setSetting(patch) {
    if (MOCK) { Object.assign(A.settings, patch); return true; }
    const { data, error } = await sb.from('settings').select('value').eq('key', 'apollo').maybeSingle();
    if (error || !data) { toast('Opslaan lukte niet. Probeer het zo nog eens.'); return false; }

        </div><p class="small muted">Alleen een eigen Apollo-adres, nooit een Lead Engine-adres. SMTP/IMAP van TransIP staan standaard goed. Het wachtwoord zet Claude in het secret APOLLO_MAILBOX_PASSWORDS.</p>`, 'Toevoegen', async (form) => {
        const email = form.email.value.trim().toLowerCase();

        if (A.mailboxes.some((m) => m.email === email)) { toast(A.mailboxes.find((m) => m.email === email).engine === 'lead_engine' ? 'Dit adres is van de Lead Engine' : 'Deze mailbox staat er al'); return false; }
        const row = { email, engine: 'apollo', display_name: form.display_name.value.trim() || 'Jiang Borghans', daily_limit: Number(form.daily_limit.value || 0),
          new_per_day: form.new_per_day.value === '' ? null : Number(form.new_per_day.value), active: true };

    if (k === 'tpl-save') {
      const box = t.closest('[data-apo-tpl]'), step = Number(box.dataset.apoTpl);
      const fields = { body: box.querySelector('[name=body]').value };

      const cnt = A.leads.filter((x) => x.is_test).length;

      const r = await action('delete_test_leads', {});

      if (r) { toast(`${n(r.deleted)} testleads verwijderd`); await loadAll(); viewSettings(); }

  });

  document.addEventListener('change', async (e) => {
    const t = e.target;
    if (t.id === 'apo-score') { A.score = t.value; viewLeads(); return; }

    if (t.dataset?.apoSet) {
      const k = t.dataset.apoSet, on = t.checked, s = A.settings || {};

      if (live && !confirm('Testmodus uit en versturen aan: Apollo mailt dan echte leads. Doorgaan?')) { t.checked = !on; return; }
      t.disabled = true;
      const ok = await setSetting({ [k]: on });
      t.disabled = false;
      if (!ok) { t.checked = !on; return; }
      toast(`${{ enabled: 'Apollo', sending: 'Versturen', test_mode: 'Testmodus', test_fast: 'Snel testen' }[k]} ${on ? 'aan' : 'uit'}`);
      draw();
    }
  });
  document.addEventListener('input', (e) => { if (e.target.id === 'apo-q') { A.q = e.target.value; viewLeads(); } });
  document.addEventListener('focusin', (e) => {
    const box = e.target.closest?.('[data-apo-tpl]');
    if (box && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) A.lastFocus[box.dataset.apoTpl] = e.target;
  });
  document.addEventListener('submit', async (e) => {
    if (e.target.id !== 'apo-note-form') return;
    e.preventDefault();
    const text = $('#apo-note-text').value.trim(), id = e.target.dataset.id;
    if (!text) return;
    const btn = e.target.querySelector('button'); btn.disabled = true;
    const r = await action('add_note', { lead_id: id, text });
    btn.disabled = false;
    if (r) { toast('Notitie opgeslagen'); openLead(id); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && A.open && !$('#sheet').open) closeLead(); });
  document.addEventListener('click', (e) => { if (e.target.closest('#refresh') && started) loadAll(); });

  // ───────── hooks for the main script ─────────
  window.apolloRender = (soft) => draw(soft);
  window.apolloRoute = (parts) => {
    const [v, slug] = parts;
    if (v === 'lead' && slug) {
      A.view = A.view || 'leads';
      const l = A.leads.find((x) => x.slug === slug);
      if (l) { if (A.open !== l.id) openLead(l.id); } else A.openSlug = slug;
      return;
    }
    if (A.open) closeLead();
    if (VIEWS.includes(v)) A.view = v;
  };
  let booted = false;
  window.apolloStart = () => {
    if (booted) return;
    booted = true;
    loadAll();
    setInterval(() => {
      if (document.hidden) return;
      if (A.ok === false && Date.now() - A.loadedAt < 5 * 60e3) return; // not live yet: try again every 5 minutes
      loadAll();
    }, 60e3);
  };

  // ───────── ?mock: synthetic data only (never real leads) ─────────
  let MD = null;
  function mockInit() {
    if (MD) { A.leads = MD.leads; A.tasks = MD.tasks.filter((t) => t.state === 'open'); return; }
    const now = Date.now(), H = 3600e3, iso = (ms) => new Date(ms).toISOString();
    const co = [['Keukenstudio Noord', 'Sanne', 'de Vries', 'Heerlen'], ['Badkamerhuis Oost', 'Tom', 'Jansen', 'Sittard'], ['Interieur Atelier Maas', 'Lisa', 'Bakker', 'Maastricht'],
      ['Tegelhal Zuid', 'Mark', 'Visser', 'Venlo'], ['Showroom Lindenhof', 'Eva', 'Smit', 'Roermond'], ['Keuken & Co Voorbeeld', 'Bram', 'Meijer', 'Weert'],
      ['Badkamerplein Demo', 'Noor', 'de Boer', 'Kerkrade'], ['Maatwerk Interieur Test', 'Daan', 'Mulder', 'Geleen'], ['Woonatelier Voorbeeld', 'Fleur', 'de Groot', 'Brunssum'],

    const statuses = ['actief', 'actief', 'gereageerd', 'actief', 'nieuw', 'nieuw', 'klaar', 'intake', 'actief', 'gestopt', 'bounced', 'nieuw'];
    const steps = [2, 1, 3, 4, 0, 0, 5, 2, 3, 2, 1, 0];
    const leads = co.map(([company, first, last, city], i) => {

        phone: [1, 5, 8].includes(i) ? null : `+3145${String(5000000 + i * 7311).slice(0, 7)}`, company, domain: `${slug}.example`, website: `https://${slug}.example`,
        city, country: 'Netherlands', employees: 3 + i * 2, linkedin: null, page_url: `https://socialwave-agency.nl/a/${slug}`,
        status: statuses[i], step: steps[i], sender_email: `jiang@apollo-${(i % 2) + 1}.example`, subject: steps[i] ? `Idee voor ${company}` : null,
        first_sent_at: steps[i] ? iso(now - (steps[i] * 2 + 1) * 24 * H) : null, last_sent_at: steps[i] ? iso(now - 26 * H) : null,
        next_send_at: ['actief', 'nieuw'].includes(statuses[i]) ? iso(now + (i + 1) * 2.5 * H) : null,
        score_auto: ['A', 'B', 'C', null][i % 4], score_override: i === 4 ? 'A' : null, score: i === 4 ? 'A' : ['A', 'B', 'C', null][i % 4],
        score_signals: i % 4 === 3 ? {} : { showroom: true, reviews: 40 + i * 9, instagram_volgers: 800 + i * 150, website_oud: i % 2 === 0 },
        personal: [4, 11].includes(i) || (i === 5) ? null : `Mooi hoe ${company} op de website laat zien hoe een project van schets tot oplevering gaat.`,
        personal_facts: [4, 11, 5].includes(i) ? [] : [{ fact: 'Toont projecten van schets tot oplevering', source: `https://${slug}.example/projecten` }, { fact: `Showroom in ${city}`, source: `https://${slug}.example/contact` }],
        personal_at: [4, 11, 5].includes(i) ? null : iso(now - 30 * H),

        phone_missing: [1, 5, 8].includes(i), page_views: visited ? 1 + (i % 3) : 0, first_visit_at: visited ? iso(now - (i + 3) * H) : null,
        last_visit_at: visited ? iso(now - (i + 1) * 0.7 * H) : null, reply_at: statuses[i] === 'gereageerd' ? iso(now - 5 * H) : null,
        reply_snippet: statuses[i] === 'gereageerd' ? 'Hoi Jiang, leuk filmpje! Bel me volgende week maar even.' : null, reply_class: statuses[i] === 'gereageerd' ? 'positief' : null,
        call_attempts: i === 2 ? 1 : 0, call_outcome: i === 2 ? 'geen_gehoor' : null, is_test: i === 11, do_not_contact: false, import_order: i, notes: null,
        created_at: iso(now - 9 * 24 * H), updated_at: iso(now - H),
      };
    });
    const tasks = [0, 3, 8, 2].map((i, k) => ({ id: `apo-task-${k + 1}`, lead_id: leads[i].id, kind: 'call', state: 'open',
      due_at: iso(now + (k < 3 ? -(k + 1) * 0.5 * H : 26 * H)), payload: { reason: k === 3 ? 'reageerde, terugbellen' : 'bekeek de pagina' } }));
    const events = [];
    leads.forEach((l) => {
      for (let s = 1; s <= l.step; s++) events.push({ id: events.length + 1, lead_id: l.id, at: iso(now - (l.step - s + 1) * 40 * H), type: 'sent', data: { step: s, from: l.sender_email } });
      if (l.page_views) {
        events.push({ id: events.length + 1, lead_id: l.id, at: l.last_visit_at, type: 'page_view', data: {} });
        events.push({ id: events.length + 1, lead_id: l.id, at: iso(new Date(l.last_visit_at).getTime() + 30e3), type: 'video_play', data: {} });
      }
      if (l.reply_snippet) events.push({ id: events.length + 1, lead_id: l.id, at: l.reply_at, type: 'reply', data: { snippet: l.reply_snippet } });
    });
    MD = {
      leads, tasks, events,
      templates: [
        { step: 1, subject: 'Idee voor {{bedrijf}}', body: 'Hoi {{voornaam}},\n\n{{persoonlijk}}\n\nIk heb een korte video voor {{bedrijf}} opgenomen.\n\n{{video}}\n\nHier kun je hem bekijken (1 minuut):\n{{link}}\n\nGroetjes,\nJiang Borghans\nSocial Wave' },
        { step: 2, subject: '', body: 'Hoi {{voornaam}},\n\nHeb je de video al kunnen bekijken? Hij staat hier:\n{{link}}\n\nGroetjes,\nJiang' },
        { step: 3, subject: '', body: 'Hoi {{voornaam}},\n\nIk ben benieuwd wat je ervan vindt:\n{{link}}\n\nGroetjes,\nJiang' },
        { step: 4, subject: '', body: 'Hoi {{voornaam}},\n\nNog even een herinnering aan de video voor {{bedrijf}}:\n{{link}}\n\nGroetjes,\nJiang' },
        { step: 5, subject: '', body: 'Hoi {{voornaam}},\n\nDit is mijn laatste berichtje hierover:\n{{link}}\n\nGroetjes,\nJiang' },
      ].map((t) => ({ ...t, updated_at: iso(now - 50 * H) })),
      mailboxes: [
        { email: 'jiang@apollo-1.example', engine: 'apollo', daily_limit: 20, new_per_day: null, active: true, display_name: 'Jiang Borghans' },

        { email: 'jiang@leadengine-2.example', engine: 'lead_engine', daily_limit: 5, active: true, note: 'Lead Engine (senders.ts)' },
        { email: 'info@leadengine-1.example', engine: 'lead_engine', daily_limit: 0, active: true, note: 'Lead Engine (senders.ts), alleen follow-ups' },
      ],

    };
    A.leads = MD.leads; A.tasks = MD.tasks.filter((t) => t.state === 'open'); A.templates = MD.templates; A.mailboxes = MD.mailboxes; A.settings = MD.settings;
  }
  function mockStats(p) {
    const f = { week: 1, maand: 4, totaal: 9 }[p];
    return [
      { source: 'lead_engine', leads_added: 30 * f, first_mails: 28 * f, followups: 50 * f, visited: 9 * f, replied: 3 * f, called: 6 * f, intakes: Math.round(1.6 * f), klanten: Math.round(0.4 * f) },
      { source: 'apollo', leads_added: 60 * f, first_mails: 45 * f, followups: 70 * f, visited: 7 * f, replied: 2 * f, called: 5 * f, intakes: Math.round(1.1 * f), klanten: Math.round(0.2 * f) },
    ];
  }
  function mockAction(name, b) {
    console.log('mock apollo-action', name, b);
    const now = new Date().toISOString(), l = b.lead_id ? MD.leads.find((x) => x.id === b.lead_id) : null;
    const ev = (type, data) => MD.events.push({ id: MD.events.length + 1, lead_id: b.lead_id, at: now, type, data });
    switch (name) {
      case 'status': return { settings: MD.settings, mailboxes: MD.mailboxes.filter((m) => m.engine === 'apollo').map((m, i) => ({ ...m, password_set: i === 0, sent_today: 4 - i, new_today: 2 - i, last_check_at: now, last_error: null })),
        queue: { waiting: MD.leads.filter((x) => x.status === 'nieuw').length, A: 2, B: 1, C: 1, unscored: 1, due_today: 3 }, calls_open: MD.tasks.filter((t) => t.state === 'open').length,
        personal: { ready: MD.leads.filter((x) => x.personal).length, pending: MD.leads.filter((x) => needsPersonal(x) && !x.personal_error).length, failed: MD.leads.filter((x) => needsPersonal(x) && x.personal_error).length },
        media: { ready: MD.leads.filter((x) => x.media_at).length, pending: MD.leads.filter((x) => !x.media_at && !x.media_error).length, failed: MD.leads.filter((x) => !x.media_at && x.media_error).length } };
      case 'set_score': Object.assign(l, { score_override: b.score, score: b.score || l.score_auto }); return { lead: l };
      case 'set_personal': Object.assign(l, { personal: b.text, personal_at: b.text ? now : null, personal_error: null, personal_facts: b.text ? [] : l.personal_facts }); return { lead: l };
      case 'stop': Object.assign(l, { status: 'gestopt', next_send_at: null }); ev('status_change', { to: 'gestopt' }); return { lead: l };
      case 'resume': Object.assign(l, { status: 'actief', next_send_at: new Date(Date.now() + 864e5).toISOString() }); ev('status_change', { to: 'actief' }); return { lead: l };
      case 'add_note': ev('note', { text: b.text }); return { ok: true };
      case 'log_call': {
        ev('call_logged', { outcome: b.outcome, at: b.at, note: b.note });
        l.call_attempts = (l.call_attempts || 0) + 1; l.call_outcome = b.outcome;
        if (b.outcome === 'afspraak') l.status = 'intake';
        if (b.outcome === 'geen_interesse') l.status = 'geen_interesse';
        MD.tasks.filter((t) => t.lead_id === l.id && t.state === 'open').forEach((t) => { t.state = 'done'; });
        if (b.outcome === 'terugbellen') MD.tasks.push({ id: `apo-task-${Date.now()}`, lead_id: l.id, kind: 'call', state: 'open', due_at: b.at, payload: { reason: 'terugbellen' } });
        return { lead: l };
      }
      case 'skip_call': { const t = MD.tasks.find((x) => x.id === b.task_id); if (t) t.state = 'skipped'; return { ok: true }; }
      case 'import_csv': {
        const lines = b.csv.split(/\r?\n/).filter((x) => x.trim()).slice(1);
        const skipped = lines.filter((_, i) => i % 3 === 2).map((x, i) => ({ company: x.split(/[,;]/)[0] || `Rij ${i + 1}`, email: null, reason: ['lead_engine', 'duplicate_domain', 'no_email'][i % 3] }));
        return { import_id: 'mock', rows: lines.length, added: lines.length - skipped.length, skipped };
      }
      case 'create_test_leads': return { added: 5 };
      case 'delete_test_leads': { const k = MD.leads.filter((x) => x.is_test).length; MD.leads = MD.leads.filter((x) => !x.is_test); A.leads = MD.leads; return { deleted: k }; }
      case 'check_mailbox': return { smtp: 'ok', imap: b.email.endsWith('2.example') ? 'login mislukt' : 'ok' };
      default: return { ok: true };
    }
  }
  // ?mock starts the app before this script ran: catch up.
  if (started) window.apolloStart();
})();
