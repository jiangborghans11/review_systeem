<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script>try { const t = localStorage.getItem('sw-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<title>SW Lead Engine</title>
<link rel="icon" href="/site/media/favicon.png">
<link rel="apple-touch-icon" href="/site/media/apple-touch-icon.png">
<!--
  SW Lead Engine on the desktop: the same data as the SW Leads iOS app (Supabase project sw-lead-engine).
  Read-only overview. Sign-in: the web-login edge function mails a one-time link (#login=<token_hash>) to the
  owner's own address. Row level security only lets the owner uid read anything, so the publishable key below
  is safe in a public file (it also ships in the app).
-->
<style>
:root {
  --blue: #0071E3; --soft-blue: #E8F1FF;
  --ink: #1D1D1F; --muted: #6E6E73; --faint: #86868B;
  --bg: #F5F5F7; --card: #FFFFFF; --line: rgba(0,0,0,.08); --hover: rgba(0,0,0,.035);
  --green: #1FA54A; --green-bg: rgba(52,199,89,.14);
  --orange: #E08600; --orange-bg: rgba(255,149,0,.15);
  --red: #E5352B; --red-bg: rgba(255,59,48,.12);
  --grey-bg: rgba(142,142,147,.16);
  --purple: #8944AB; --purple-bg: rgba(175,82,222,.14);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 18px rgba(0,0,0,.05);
  --radius: 18px;
}
/* Dark follows the system unless the toggle picked one (html[data-theme], remembered per browser). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue: #0A84FF; --soft-blue: #0A2A4D;
    --ink: #F5F5F7; --muted: #AEAEB2; --faint: #8E8E93;
    --bg: #000000; --card: #1C1C1E; --line: rgba(255,255,255,.09); --hover: rgba(255,255,255,.05);
    --green: #32D74B; --orange: #FF9F0A; --red: #FF453A; --purple: #BF5AF2;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --blue: #0A84FF; --soft-blue: #0A2A4D;
  --ink: #F5F5F7; --muted: #AEAEB2; --faint: #8E8E93;
  --bg: #000000; --card: #1C1C1E; --line: rgba(255,255,255,.09); --hover: rgba(255,255,255,.05);
  --green: #32D74B; --orange: #FF9F0A; --red: #FF453A; --purple: #BF5AF2;
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--ink); min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, select { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }

/* ── Login ── */
#login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.login-card {
  width: 100%; max-width: 380px; background: var(--card); border-radius: 24px; padding: 36px 32px;
  box-shadow: var(--shadow); text-align: center;
}
.login-card img { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 16px; }
.login-card h1 { font-size: 24px; letter-spacing: -.02em; }
.login-card p { color: var(--muted); margin: 6px 0 22px; }
.field {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); outline: none;
}
.field:focus { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 20%, transparent); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 14px; border-radius: 999px; font-weight: 600; font-size: 14px;
  background: var(--hover); transition: background .15s, transform .1s;
}
.btn:hover { background: var(--line); text-decoration: none; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--blue); color: #fff; }
.btn.primary:hover { background: color-mix(in srgb, var(--blue) 88%, #000); }
.btn.block { width: 100%; padding: 12px; margin-top: 12px; font-size: 15px; }
.btn.icon { padding: 8px; }
.login-msg { margin-top: 14px; font-size: 14px; }
.login-msg.err { color: var(--red); }

/* ── Shell ── */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
}
.top-inner { max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.brand img { width: 30px; height: 30px; border-radius: 8px; }
.tabs { display: flex; gap: 4px; background: var(--hover); padding: 4px; border-radius: 999px; }
.tabs a {
  padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 14px;
  display: flex; align-items: center; gap: 6px;
}
.tabs a:hover { text-decoration: none; color: var(--ink); }
.tabs a.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.badge { background: var(--orange); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; font-weight: 700; }
.spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; background: var(--green-bg); color: var(--green); white-space: nowrap;
}
.pill.bad { background: var(--red-bg); color: var(--red); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill:not(.bad) .dot { animation: pulse 2.4s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 80px; }

/* ── Cards / grid ── */
.hello { margin-bottom: 22px; }
.hello h1 { font-size: 32px; letter-spacing: -.025em; line-height: 1.15; }
.hello p { color: var(--muted); margin-top: 4px; font-size: 16px; }
.grid { display: grid; gap: 16px; }
.g-kpi { grid-template-columns: repeat(5, 1fr); }
.g-2 { grid-template-columns: 1.35fr 1fr; }
.g-3 { grid-template-columns: repeat(3, 1fr); }
.card { background: var(--card); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.card h2 .sub { font-weight: 500; color: var(--faint); font-size: 13px; margin-left: auto; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.kpi .v { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.kpi .l { font-weight: 600; margin-top: 2px; }
.kpi .c { color: var(--faint); font-size: 13px; }
.kpi .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; margin-bottom: 12px; }
.ic.blue { background: var(--soft-blue); color: var(--blue); }
.ic.green { background: var(--green-bg); color: var(--green); }
.ic.orange { background: var(--orange-bg); color: var(--orange); }
.ic.red { background: var(--red-bg); color: var(--red); }

.banner {
  display: flex; gap: 12px; align-items: flex-start; background: var(--red-bg); color: var(--ink);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 18px;
}
.banner svg { color: var(--red); margin-top: 2px; }
.banner b { display: block; }

.watch {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; margin-bottom: 12px;
  background: linear-gradient(100deg, var(--green-bg), transparent 80%); cursor: pointer;
}
.live { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 var(--green); animation: ring 1.8s infinite; flex: none; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }

/* Funnel */
.funnel { display: flex; flex-direction: column; gap: 11px; }
.frow { display: grid; grid-template-columns: 120px 1fr 92px; align-items: center; gap: 12px; }
.frow .bar { height: 26px; background: var(--hover); border-radius: 8px; overflow: hidden; }
.frow .bar span { display: block; height: 100%; border-radius: 8px; background: var(--blue); min-width: 3px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.frow .n { text-align: right; font-weight: 700; }
.frow .n small { color: var(--faint); font-weight: 500; margin-left: 4px; }

/* Pipeline */
.pipe { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
.stage {
  border-radius: 14px; padding: 12px 10px; background: var(--hover); text-align: left; transition: background .15s;
}
.stage:hover { background: var(--line); text-decoration: none; }
.stage .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); }
.stage .l { font-size: 12.5px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage.hot .v { color: var(--orange); }
.stage.good .v { color: var(--green); }

/* Bars (7 days) */
.bars { display: flex; align-items: flex-end; gap: 10px; height: 130px; padding-top: 18px; }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bars .col { width: 100%; max-width: 38px; background: var(--blue); border-radius: 7px 7px 3px 3px; position: relative; min-height: 3px; }
.bars .col.zero { background: var(--line); }
.bars .col em { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-style: normal; font-size: 12px; font-weight: 700; }
.bars .d { font-size: 12px; color: var(--faint); font-weight: 600; }
.bars .b.today .d { color: var(--blue); }

/* Mailboxes */
.mbox { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.mbox:first-of-type { border-top: 0; padding-top: 0; }
.mbox .meter { grid-column: 1 / -1; height: 6px; border-radius: 6px; background: var(--hover); overflow: hidden; }
.mbox .meter span { display: block; height: 100%; background: var(--blue); border-radius: 6px; }
.mbox .meter span.full { background: var(--orange); }
.mbox b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }

/* Week */
.week { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 6px; }
.week div { background: var(--hover); border-radius: 12px; padding: 10px 12px; }
.week .v { font-size: 22px; font-weight: 700; }
.week .l { font-size: 12.5px; color: var(--muted); font-weight: 600; }

/* Chips */
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 650; white-space: nowrap;
}
.st-green { color: var(--green); background: var(--green-bg); }
.st-orange { color: var(--orange); background: var(--orange-bg); }
.st-red { color: var(--red); background: var(--red-bg); }
.st-grey { color: var(--muted); background: var(--grey-bg); }
.st-blue { color: var(--blue); background: var(--soft-blue); }
.st-purple { color: var(--purple); background: var(--purple-bg); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--blue); }

/* Today */
.tgroup { margin-bottom: 26px; }
.vbtn { display: grid; grid-template-columns: 44px 1fr auto auto; gap: 14px; align-items: center; padding: 14px 18px; margin-bottom: 16px; color: var(--ink); }
.vbtn:hover { text-decoration: none; background: var(--hover); }
.vbtn .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
.vbtn .n { font-size: 20px; font-weight: 700; color: var(--muted); }
.vbtn .go { font-size: 22px; color: var(--faint); }
.stabs a { padding: 7px 13px; border-radius: 999px; background: var(--hover); color: var(--ink); font-size: 13.5px; font-weight: 650; white-space: nowrap; }
.stabs a:hover { text-decoration: none; background: var(--line); }
.stabs a span { color: var(--faint); font-weight: 600; }
.stabs a.on { background: var(--ink); color: var(--bg); }
.stabs a.on span { color: inherit; opacity: .6; }
.task h4 .live { margin-right: 2px; }
.tgroup > h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 0 0 10px 4px; }
.task { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 16px 18px; margin-bottom: 10px; }
.task .tic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
.task .tic svg { width: 20px; height: 20px; }
.task h4 { font-size: 16px; font-weight: 650; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.task .meta { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.task .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.task .late { color: var(--red); font-weight: 600; }
details.script { grid-column: 2 / -1; font-size: 14px; }
details.script summary { cursor: pointer; color: var(--blue); font-weight: 600; font-size: 13.5px; list-style: none; }
details.script summary::-webkit-details-marker { display: none; }
details.script pre { white-space: pre-wrap; font: inherit; background: var(--hover); border-radius: 12px; padding: 12px 14px; margin-top: 8px; }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty svg { width: 40px; height: 40px; color: var(--green); margin-bottom: 10px; stroke-width: 1.6; }
.empty b { display: block; color: var(--ink); font-size: 18px; }

/* Leads table */
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.search { position: relative; flex: 1; min-width: 220px; max-width: 360px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.search input { width: 100%; padding: 9px 12px 9px 36px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); outline: none; }
.search input:focus { border-color: var(--blue); }
select.sel { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); outline: none; }
.stabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
.stabs button {
  padding: 7px 13px; border-radius: 999px; font-weight: 600; font-size: 13.5px; color: var(--muted);
  background: var(--card); box-shadow: var(--shadow); white-space: nowrap; display: flex; gap: 7px; align-items: center;
}
.stabs button span { color: var(--faint); font-weight: 600; }
.stabs button.on { background: var(--ink); color: var(--bg); }
.stabs button.on span { color: inherit; opacity: .6; }
.stage-sub { color: var(--faint); font-size: 13px; margin: -6px 0 12px 4px; }
.tablewrap { padding: 6px 0; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 650; padding: 10px 14px; white-space: nowrap; }
td { padding: 11px 14px; border-top: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
tbody tr { cursor: pointer; transition: background .1s; }
tbody tr:hover { background: var(--hover); }
td.co b { font-weight: 650; display: flex; align-items: center; gap: 8px; }
td.co div { color: var(--muted); font-size: 12.5px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.sig { display: inline-flex; align-items: center; gap: 4px; color: var(--faint); }
.sig.on { color: var(--blue); }
.sig.video.on { color: var(--green); }

/* Drawer */
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
#scrim.open { opacity: 1; pointer-events: auto; }
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); z-index: 50; background: var(--bg);
  transform: translateX(102%); transition: transform .28s cubic-bezier(.2,.8,.2,1); overflow-y: auto;
  box-shadow: -10px 0 40px rgba(0,0,0,.15);
}
#drawer.open { transform: none; }
.dhead { padding: 22px 24px 10px; position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); z-index: 2; }
.dhead .x { position: absolute; right: 16px; top: 16px; }
.dhead h2 { font-size: 24px; letter-spacing: -.02em; padding-right: 40px; }
.dhead .who { color: var(--muted); margin-top: 2px; }
.dhead .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.dbody { padding: 8px 24px 40px; display: flex; flex-direction: column; gap: 14px; }
.dbody .card { padding: 16px 18px; }
.dbody .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); margin-bottom: 10px; }
.rows > div { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.rows > div svg { margin-top: 3px; }
.rows .k { color: var(--muted); min-width: 110px; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.reply { background: var(--orange-bg); border-radius: 12px; padding: 12px 14px; white-space: pre-wrap; }
.timeline { position: relative; }
.ev { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 7px 0; align-items: baseline; }
.ev .t { color: var(--faint); font-size: 12.5px; white-space: nowrap; }
.ev.c-blue svg { color: var(--blue); } .ev.c-green svg { color: var(--green); } .ev.c-orange svg { color: var(--orange); }
.ev.c-red svg { color: var(--red); } .ev.c-grey svg { color: var(--faint); }
.note-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.note-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.remind { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.remind input, .remind-edit input {
  padding: 6px 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: inherit; font: inherit; font-size: 13px;
}
.qp { padding: 4px 9px; border-radius: 999px; background: var(--hover); font-size: 12.5px; font-weight: 600; color: var(--muted); }
.qp:hover { color: var(--ink); background: var(--line); }
.note-row .btn.primary { margin-left: auto; }
.note-bell { color: var(--faint); padding: 2px 6px; border-radius: 8px; }
.note-bell:hover { background: var(--hover); color: var(--orange); }
.remind-chip { margin-top: 5px; }
.remind-edit { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.note-form textarea {
  width: 100%; resize: vertical; min-height: 44px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); outline: none; font: inherit; color: inherit;
}
.note-form textarea:focus { border-color: var(--blue); }
.note { padding: 10px 0; border-top: 1px solid var(--line); }
.note:first-child { border-top: 0; }
.note-meta { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--faint); }
.note-meta .note-bell { margin-left: auto; }
.note-del { color: var(--faint); padding: 2px 7px; border-radius: 8px; font-size: 12px; font-weight: 600; }
.note-del:hover { background: var(--hover); color: var(--red); }
.note-del.confirm { color: #fff; background: var(--red); }
.note-text { white-space: pre-wrap; margin-top: 3px; overflow-wrap: anywhere; }
.skel { background: linear-gradient(90deg, var(--hover), var(--line), var(--hover)); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 8px; height: 14px; margin: 8px 0; }
@keyframes sh { to { background-position: -200% 0; } }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px;
  transition: all .2s; z-index: 60; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%); }
.foot { text-align: center; color: var(--faint); font-size: 12.5px; margin-top: 30px; }

/* Script */
.script-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.sec { display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 18px 0; border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; padding-top: 4px; }
.sec .nr { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--soft-blue); color: var(--blue); font-weight: 700; }
.sec h3 { font-size: 17px; letter-spacing: -.01em; }
.sec ul { margin: 6px 0 0 18px; color: var(--muted); }
.sec li { margin: 2px 0; }
.sec-edit { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; padding: 14px 0; border-top: 1px solid var(--line); }

// ───────────── Formatting (Dutch, Amsterdam time) ─────────────
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Gmail snippets arrive HTML-escaped ("&lt;info@…&gt;"): back to plain text before esc().
const unent = (s) => { const t = document.createElement('textarea'); t.innerHTML = String(s ?? ''); return t.value; };
const D = (v) => (v ? new Date(v) : null);
const dayKey = (d) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
const fTime = new Intl.DateTimeFormat('nl-NL', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
const fDay = new Intl.DateTimeFormat('nl-NL', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short' });
const fFull = new Intl.DateTimeFormat('nl-NL', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
const fWd = new Intl.DateTimeFormat('nl-NL', { timeZone: 'UTC', weekday: 'short' });
const rtf = new Intl.RelativeTimeFormat('nl', { numeric: 'auto' });
const time = (d) => fTime.format(d);
const day = (d) => fDay.format(d).replace(/\./g, '');
function due(v) {
  const d = D(v); if (!d) return '–';
  const k = dayKey(d), now = Date.now();
  if (k === dayKey(new Date(now))) return `vandaag ${time(d)}`;
  if (k === dayKey(new Date(now + 864e5))) return `morgen ${time(d)}`;
  if (k === dayKey(new Date(now - 864e5))) return `gisteren ${time(d)}`;
  return `${day(d)} ${time(d)}`;
}
function rel(v) {
  const d = D(v); if (!d) return '–';
  const s = (d.getTime() - Date.now()) / 1000;
  if (Math.abs(s) < 60) return 'zojuist';
  if (Math.abs(s) < 3600) return rtf.format(Math.round(s / 60), 'minute');
  return due(d);
}
const pct = (a, b) => (b ? `${Math.round((a / b) * 100)}%` : '–');
const href = (u) => { const s = String(u || '').trim(); if (!s) return null; const h = /^https?:\/\//i.test(s) ? s : `https://${s}`; try { return new URL(h).href; } catch { return null; } };
const tel = (p) => (p ? `tel:${String(p).replace(/[^+\d]/g, '')}` : null);
// +31 6 1234 5678 for mobiles, +31 45 572 3050 for landlines.
const prettyPhone = (p) => {
  const s = String(p || ''), m = s.match(/^\+31(\d{9})$/);
  if (!m) return s;
  const n = m[1];
  return n[0] === '6' ? `+31 6 ${n.slice(1, 5)} ${n.slice(5)}` : `+31 ${n.slice(0, 2)} ${n.slice(2, 5)} ${n.slice(5)}`;
};
const host = (u) => { try { return new URL(href(u)).hostname.replace(/^www\./, ''); } catch { return u; } };
const isLive = (l) => l.last_seen_at && Date.now() - new Date(l.last_seen_at).getTime() < 15 * 60e3;
const isTest = (l) => l.source === 'test';

const nextDate = (l) => (l.status === 'concept' ? S.firstDue[l.id] : null) || l.next_action_at;

const dots = (step) => `<span class="dots" title="Stap ${Math.min(step || 0, 4)} van 4">${[1, 2, 3, 4].map((i) => `<i class="${i <= (step || 0) ? 'on' : ''}"></i>`).join('')}</span>`;

let mockData = null;
async function load() {
  try {
    if (MOCK) {
      mockData = mockData || await (await fetch('mock-snap.json')).json();
      const m = mockData;
      S = {
        leads: m.leads || [], today: m.today || [], dash: (m.dash || [])[0] || null, sources: m.sources || [], sends: m.sends || [],
        settings: Object.fromEntries((m.settings || []).map((r) => [r.key, r.value])),
        firstDue: firstDueMap(m.firstDue || []), loadedAt: new Date(),
        video: (m.events || []).filter((e) => VIDEO_EVENTS.includes(e.type)).sort((a, b) => b.at.localeCompare(a.at)),
      };
    } else {
      const q = await Promise.all([
        sb.from('leads').select('*').order('next_action_at', { ascending: true, nullsFirst: false }),
        sb.from('v_today').select('*'),
        sb.from('v_dashboard').select('*'),
        sb.from('v_reaction_sources').select('*'),
        sb.from('v_sends_7d').select('*').order('day'),
        sb.from('settings').select('key,value'),
        sb.from('tasks').select('lead_id,due_at').eq('kind', 'send_first').eq('state', 'open'),
        sb.from('lead_events').select('id,lead_id,at,type').in('type', VIDEO_EVENTS).order('at', { ascending: false }).limit(3000),
      ]);
      const bad = q.find((r) => r.error);
      if (bad) throw bad.error;
      const [leads, today, dash, sources, sends, settings, firstDue, video] = q.map((r) => r.data || []);
      if (!settings.length) { showNoAccess(); return; }
      S = {
        leads, today, dash: dash[0] || null, sources, sends,
        settings: Object.fromEntries(settings.map((r) => [r.key, r.value])),
        firstDue: firstDueMap(firstDue), loadedAt: new Date(), video,
      };
      ownerPing();
    }
    render();
  } catch (e) {
    console.error(e);
    toast('Laden lukte niet. Probeer het zo nog eens.');
  }
}
function firstDueMap(rows) {
  const m = {};
  for (const r of rows) if (!m[r.lead_id] || r.due_at < m[r.lead_id]) m[r.lead_id] = r.due_at;
  return m;
}

async function act(action, body) {
  if (MOCK) {
    const notes = (mockData.notes = mockData.notes || []);
    if (action === 'add_note') notes.push({ id: Date.now(), lead_id: body.lead_id, text: body.note, source: 'web', created_at: new Date().toISOString(), remind_at: body.remind_at || null });
    if (action === 'set_note_reminder') { const n = notes.find((x) => x.id === body.note_id); if (n) Object.assign(n, { remind_at: body.remind_at, reminded_at: null }); }
    if (action === 'delete_note') mockData.notes = notes.filter((n) => n.id !== body.note_id);
    if (action === 'sender_options') return { ok: true, fixed: null, suggested: 'jiang@social-wave.nl', options: [{ email: 'jiang@social-wave.nl', room: 2 }, { email: 'info@social-wave.nl', room: 1 }] };
    const l = S.leads.find((x) => x.id === body.lead_id);
    if (l && action === 'set_status') l.status = body.status;
    if (l && action === 'plan_closing') {
      Object.assign(l, { status: 'closing', meeting_at: body.meeting_at });
      const base = mockClosing(l), online = body.mode !== 'offline';
      mockData.closing = { ...base, title: body.title, description: body.description, location: body.location || null, notify: body.notify, reminder: body.reminder,
        start: body.meeting_at, end: body.end_at, online, meet: online ? base.meet : null,
        guests: [...base.guests, ...body.guests.map((email) => ({ email, name: null, status: 'needsAction', lead: false }))],
        mails: base.mails.map((m) => (m.kind === 'link' && !online ? { ...m, kind: 'vandaag' } : m)) };
    }
    if (action === 'closing_info') return { ok: true, upcoming: l?.status === 'closing' ? mockData.closing || mockClosing(l) : null, defaults: { title: `Afspraak Social Wave × ${l?.company}`, description: `Vervolgafspraak met Jiang van Social Wave over ${l?.company}.`, location: 'Hoofdstraat 1, 6411 AB Heerlen', email: l?.email, name: l?.contact_name } };
    if (l && action === 'cancel_closing') { l.meeting_at = null; mockData.closing = null; mockData.closingCancelled = true; }
    if (l && action === 'set_meeting') Object.assign(l, { status: l.status === 'closing' ? 'closing' : 'intake', meeting_at: body.meeting_at });
    console.log('mock act', action, body);
    return { ok: true };
  }
  const { data, error } = await sb.functions.invoke('task-action', { body: { action, ...body } });
  if (error || data?.error) {
    const code = data?.error || await error?.context?.json?.().then((j) => j.error).catch(() => null);
    toast({
      bad_remind_at: 'Kies een moment in de toekomst', note_not_found: 'Die notitie bestaat niet meer',
      task_not_open: 'Deze taak is al afgehandeld', draft_gone: 'Het concept staat niet meer in Gmail',
      mailbox_full: 'Deze mailbox zit vandaag vol', mailboxes_full: 'Alle mailboxen zitten vandaag vol',
      do_not_contact: 'Deze lead mag niet meer gecontacteerd worden', bad_sender: 'Dat adres kan nu niet',
      gmail_not_configured: 'Gmail is niet gekoppeld', confirm_mismatch: 'Verwijderen niet bevestigd',
      bad_meeting_at: 'Kies een datum en tijd', bad_until: 'Kies een moment', bad_status: 'Die status bestaat niet',
      meeting_in_past: 'Kies een moment in de toekomst', no_location: 'Vul het adres in voor een afspraak op locatie',
      bad_end: 'De eindtijd moet na de begintijd liggen', bad_guest: 'Een van de gasten heeft geen geldig e-mailadres',
    }[code] || 'Opslaan lukte niet. Probeer het zo nog eens.');
    return false;
  }
  return data || { ok: true };
}

function engineProblem() {
  const s = S.settings.engine_status;
  if (!s) return null;
  if (s.gmail_ok === false) return ['Gmail-koppeling werkt niet', 'Er gaan geen mails of follow-ups klaar. Vraag Claude om Gmail opnieuw te koppelen.'];
  if (s.last_tick && Date.now() - new Date(s.last_tick) > 30 * 60e3) return ['Lead engine draait niet', `Laatste ronde ${rel(s.last_tick)}. Vraag Claude om te kijken.`];
  if (s.failing_since && Date.now() - new Date(s.failing_since) > 30 * 60e3) return ['Lead engine heeft een probleem', `Sinds ${rel(s.failing_since)}. Vraag Claude om te kijken.`];
  return null;
}

function renderTop() {
  for (const a of document.querySelectorAll('.tabs a')) a.classList.toggle('on', a.dataset.tab === UI.tab);
  const b = $('#today-badge');
  b.hidden = !S.today.length; b.textContent = S.today.length;
  const pill = $('#engine-pill'), s = S.settings.engine_status, p = engineProblem();
  pill.hidden = !s;
  if (s) {
    pill.classList.toggle('bad', !!p);
    pill.querySelector('.txt').textContent = p ? p[0] : `Engine draait · ronde ${rel(s.last_tick)}`;
  }
}

function banner() {
  const p = engineProblem();
  return p ? `<div class="banner">${icon('alert')}<div><b>${esc(p[0])}</b><span class="muted">${esc(p[1])}</span></div></div>` : '';
}

// ───────────── Video bekeken ─────────────
// Every visit in which a lead watched the video (or opened the planner), with whether a call, reply or booking
// came after it. Same rules as the app's VideoHistoryView: 30-minute gaps split visits, test leads left out.
const VIDEO_WATCH = ['video_play', 'video_50', 'video_end', 'plan_open'];
const VIDEO_FOLLOW = { call_logged: 'Gebeld', reply: 'Gereageerd', booking: 'Afspraak gemaakt', closing_planned: 'Afspraak gemaakt' };
const VIDEO_EVENTS = [...VIDEO_WATCH, ...Object.keys(VIDEO_FOLLOW)];
const OPEN_STATUSES = ['concept', 'gemaild', 'followup', 'followup2', 'dm', 'bellen'];

function videoVisits() {
  const leads = new Map(S.leads.filter((l) => !isTest(l)).map((l) => [l.id, l]));
  const byLead = new Map();
  for (const e of S.video) { if (leads.has(e.lead_id)) (byLead.get(e.lead_id) || byLead.set(e.lead_id, []).get(e.lead_id)).push(e); }
  const out = [];
  for (const [id, evs] of byLead) {
    const lead = leads.get(id);
    const asc = evs.slice().sort((a, b) => a.at.localeCompare(b.at));
    const visits = [];
    for (const e of asc) {
      if (!VIDEO_WATCH.includes(e.type)) continue;
      const cur = visits[visits.length - 1], last = cur?.[cur.length - 1];
      if (last && new Date(e.at) - new Date(last.at) < 30 * 60e3) cur.push(e); else visits.push([e]);
    }
    visits.forEach((v, i) => {
      const types = new Set(v.map((e) => e.type)), at = v[0].at;
      const f = asc.find((e) => e.at > at && VIDEO_FOLLOW[e.type]);
      const followUp = f ? VIDEO_FOLLOW[f.type] : null;
      out.push({
        id: v[0].id, lead, at, followUp, latest: i === visits.length - 1,
        watched: ['video_play', 'video_50', 'video_end'].some((t) => types.has(t)),
        half: types.has('video_50'), completed: types.has('video_end'), planner: types.has('plan_open'),
        open: !followUp && !lead.do_not_contact && OPEN_STATUSES.includes(lead.status),
      });
    });
  }
  return out.sort((a, b) => b.at.localeCompare(a.at));
}

function videoButton(real) {
  const watchers = real.filter((l) => l.video_plays > 0);
  const last = watchers.filter((l) => l.last_seen_at).sort((a, b) => b.last_seen_at.localeCompare(a.last_seen_at))[0];
  return `<a class="card vbtn" href="#video"><div class="ic green">${icon('play')}</div>
    <div><b>Video bekeken</b><div class="small muted">${last ? `Laatst: ${esc(last.company)}, ${rel(last.last_seen_at)}` : 'Wie de video keek, en wanneer'}</div></div>
    <span class="num n">${watchers.length}</span><span class="go">›</span></a>`;
}

// ───────────── Leads ─────────────
// Bare digits without country code or leading 0: "+31 6 12 34 56 78", "0031612345678", "06-12345678" → "612345678".
function phoneKey(s) {
  let d = String(s).replace(/\D/g, '');
  const intl = /^\s*\+/.test(s) || d.startsWith('00');
  if (d.startsWith('00')) d = d.slice(2);
  if (intl && d.startsWith('31')) d = d.slice(2);
  else if (d.startsWith('0')) d = d.slice(1);
  return d;
}
function filteredLeads() {
  let list = S.leads.slice();
  const q = UI.q.trim().toLowerCase();
  // A phone number matches however it is written: 06 12 34 56 78, 0612345678, +31 6 1234…
  const tel = phoneKey(q);
  if (q) list = list.filter((l) => [l.company, l.contact_name, l.email, l.city, l.phone, l.niche].some((v) => v && String(v).toLowerCase().includes(q))
    || (tel.length >= 4 && l.phone && phoneKey(l.phone).includes(tel)));
  const far = 8.64e15;
  const t = (v) => (v ? new Date(v).getTime() : null);
  if (UI.sort === 'next') list.sort((a, b) => (stageOf(a.status) - stageOf(b.status)) || ((t(nextDate(a)) ?? far) - (t(nextDate(b)) ?? far)));
  if (UI.sort === 'seen') list.sort((a, b) => (t(b.last_seen_at) ?? -far) - (t(a.last_seen_at) ?? -far));
  if (UI.sort === 'new') list.sort((a, b) => (t(b.created_at) ?? 0) - (t(a.created_at) ?? 0));
  if (UI.sort === 'name') list.sort((a, b) => a.company.localeCompare(b.company, 'nl'));
  return list;
}

    case 'booking': return [`Intake ingepland${d.meeting_at ? `: ${fFull.format(new Date(d.meeting_at))}` : ''}`, 'cal', 'green'];
    case 'closing_planned': return [`Closing ingepland${d.meeting_at ? `: ${fFull.format(new Date(d.meeting_at))}` : ''}${d.mode ? (d.mode === 'offline' ? ' · op locatie' : ' · Google Meet') : ''}`, 'cal', 'green'];
    case 'closing_cancelled': return ['Afspraak geannuleerd', 'x', 'red'];
    case 'booking_mail': return [`${MAIL_NAME[d.kind] || 'Mail'} gemaild${d.stage === 'closing' ? ' (closing)' : ''}`, 'mail', 'grey'];
    case 'bounce': return ['Mail kwam niet aan', 'alert', 'red'];
    case 'mail_open': {
      const via = { gmail: ' (Gmail)', outlook: ' (Outlook)', apple_mail: ' (Apple Mail)', yahoo: ' (Yahoo)' }[d.client] || '';
      return [`${Number(d.step || 1) >= 2 ? 'Follow-up of mail' : 'Mail'} geopend${via}`, 'open', 'blue'];
    }
    case 'status_change': return [`Status → ${STATUS[d.to]?.[0] || d.to || ''}`, 'status', 'grey'];
    case 'recontact_planned': return [`Opnieuw contact ingepland: ${due(d.due_at)}${d.note ? ` · ${d.note}` : ''}`, 'reply', 'blue'];
    case 'recontact_done': return ['Opnieuw contact opgenomen', 'reply', 'green'];
    case 'callback_planned': return [`Terugbellen ingepland: ${due(d.due_at)}${d.note ? ` · ${d.note}` : ''}`, 'clock', 'blue'];
    case 'note':
      return ({
        auto_reply: ['Automatisch antwoord', 'mail', 'grey'], dm_skipped: ['DM overgeslagen: geen social gevonden', 'reply', 'grey'],
        task_snoozed: ['Taak gesnoozed', 'clock', 'grey'], task_skipped: ['Taak overgeslagen', 'fwd', 'grey'],
        note: [`Notitie: ${d.text || ''}`, 'note', 'grey'],
      })[d.kind] || ['Notitie', 'note', 'grey'];
    default: return [e.type, 'check', 'grey'];
  }
}
// Page signals of one visit become one line (newest first), like the app.
function activity(events) {
  const shown = events.filter((e) => !(e.type === 'mail_open' && e.data?.auto != null) && e.type !== 'app_action');
  const out = [];
  for (let i = 0; i < shown.length;) {
    const e = shown[i];
    if (PAGE_SIGNALS.has(e.type)) {
      const visit = [e];
      let j = i + 1;
      while (j < shown.length && PAGE_SIGNALS.has(shown[j].type) && visit[visit.length - 1].data?.visit == null &&
             new Date(visit[visit.length - 1].at) - new Date(shown[j].at) < 30 * 60e3) { visit.push(shown[j]); j++; }
      const types = new Set(visit.map((v) => v.type));
      const parts = [types.has('video_end') ? 'Video helemaal bekeken' : types.has('video_50') ? 'Video half bekeken' : types.has('video_play') ? 'Video gestart' : 'Pagina bekeken, video niet gestart'];
      if (types.has('plan_open')) parts.push('planner geopend');
      out.push({ at: visit[visit.length - 1].at, text: parts.join(' · '), ic: 'play', c: types.has('video_play') || types.has('plan_open') ? 'green' : 'grey' });
      i = j; continue;
    }
    const [text, ic, c] = describe(e);
    out.push({ at: e.at, text, ic, c });
    i++;
  }
  return out;
}

// Jiang's own calendar per day (agenda edge function), once per editor.
let agendaCache = null;
async function agendaDays() {
  if (agendaCache && Date.now() - agendaCache.at < 60e3) return agendaCache.days;
  let days = [];
  if (MOCK) {
    const d0 = new Date(Date.now() + 2 * 864e5);
    const at = (h, m) => { const x = new Date(d0); x.setHours(h, m, 0, 0); return x.toISOString(); };
    days = [{ date: dayKey(d0), items: [
      { id: 'e1', title: 'Fotoshoot Akropolis', start: at(9, 30), end: at(11, 0), all_day: false, kind: 'event', busy: true },
      { id: 'k1', title: 'Kennismaking Social Wave × Woonstudio', start: at(13, 0), end: at(13, 15), all_day: false, kind: 'booking', busy: true },
      { id: 'e2', title: 'Sportschool', start: at(17, 0), end: at(18, 0), all_day: false, kind: 'event', busy: true }] }];
  } else {
    const { data } = await sb.functions.invoke('agenda', { body: { action: 'list', days: 90 } }).catch(() => ({ data: null }));
    days = data?.days || [];
  }
  agendaCache = { at: Date.now(), days };
  return days;
}

const AP_FIRST = 7, AP_LAST = 22, AP_H = 44;
function timelineHtml(items, start, end) {
  const y = (d) => ((tzMin(d) - AP_FIRST * 60) / 60) * AP_H;
  const clash = items.some((i) => !i.all_day && i.busy && new Date(i.start) < end && new Date(i.end) > start);
  let h = '';
  for (let hr = AP_FIRST; hr < AP_LAST; hr++) h += `<div class="ap-hr" style="top:${(hr - AP_FIRST) * AP_H}px">${String(hr).padStart(2, '0')}:00</div>`;
  for (const i of items.filter((x) => !x.all_day)) {
    const s = new Date(i.start), e = new Date(i.end);
    h += `<div class="ap-ev k-${i.kind}" style="top:${y(s)}px;height:${Math.max(16, y(e) - y(s))}px"><b>${esc(i.title)}</b> ${time(s)}–${time(e)}</div>`;
  }
  h += `<div class="ap-ev new ${clash ? 'clash' : ''}" style="top:${y(start)}px;height:${Math.max(18, y(end) - y(start))}px">Nieuwe afspraak ${time(start)}–${time(end)}</div>`;
  const allDay = items.filter((x) => x.all_day).map((x) => `<div class="ap-allday">${esc(x.title)}</div>`).join('');
  return { html: `${allDay}<div class="ap-tl" id="ap-tl"><div class="ap-tl-in" id="ap-tl-in" style="height:${(AP_LAST - AP_FIRST) * AP_H}px">${h}</div></div>`, clash };
}

async function openAppointment(l, mode) {
  const info = await closingInfo(l.id) || {};
  const u = mode === 'edit' ? info.upcoming : null;
  const d = info.defaults || {};
  const start = u ? new Date(u.start) : (() => { const x = tomorrowNine(); x.setHours(10); return x; })();
  const end = u ? new Date(u.end) : new Date(start.getTime() + 36e5);
  const st = {
    online: u ? u.online : true, guests: u ? u.guests.filter((g) => !g.lead).map((g) => g.email) : [], notify: u ? u.notify : true,
  };
  const dateV = localInput(start).slice(0, 10), tS = localInput(start).slice(11), tE = localInput(end).slice(11);
  const reminders = [['', 'Standaard melding'], ['0', 'Geen melding'], ['10', '10 min van tevoren'], ['30', '30 min van tevoren'], ['60', '1 uur van tevoren'], ['1440', '1 dag van tevoren']];
  const rem = u ? (u.reminder == null ? '' : String(u.reminder)) : '30';
  const html = `<div class="ap-grid"><div class="ap-form">
      <input class="ap-title" name="title" value="${esc(u?.title || d.title || '')}" placeholder="Titel toevoegen" required>
      <div class="ap-row">${icon('clock')}<input type="date" name="date" value="${dateV}" min="${localInput(new Date()).slice(0, 10)}" required>
        <input type="time" name="ts" value="${tS}" step="900" required> – <input type="time" name="te" value="${tE}" step="900" required></div>
      <div class="ap-chips" id="ap-dur">${[30, 45, 60, 90, 120].map((m) => `<button type="button" class="ap-chip" data-dur="${m}">${m < 60 ? `${m} min` : m === 60 ? '1 uur' : `${m / 60}`.replace('.', ',') + ' uur'}</button>`).join('')}</div>
      <label class="ap-switch"><input type="checkbox" name="online" ${st.online ? 'checked' : ''}>${icon('video')} Google Meet-videogesprek</label>
      <div class="ap-row">${icon('pin')}<input type="text" name="location" value="${esc(u?.location || (st.online ? '' : d.location || ''))}" placeholder="Locatie" data-default="${esc(d.location || '')}">
        <a class="btn small" id="ap-map" target="_blank" rel="noopener">Kaart</a></div>
      <div class="ap-row">${icon('users')}<span>${esc(d.name || d.email || 'Geen e-mailadres')}${d.email ? ` <span class="small muted">${esc(d.email)} · klant</span>` : ''}</span></div>
      <div class="ap-chips" id="ap-guests"></div>
      <div class="ap-row"><input type="email" id="ap-guest" placeholder="Gast toevoegen (e-mail), Enter"><button type="button" class="btn small" id="ap-guest-add">Toevoegen</button></div>
      <div class="ap-row">${icon('bell')}<select name="reminder">${reminders.map(([v, t]) => `<option value="${v}" ${v === rem ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <textarea name="description" placeholder="Beschrijving (ziet de klant in de uitnodiging)">${esc(u ? u.description : d.description || '')}</textarea>
      <label class="ap-switch"><input type="checkbox" name="notify" ${st.notify && d.email ? 'checked' : ''} ${d.email ? '' : 'disabled'}>${icon('mail')} Klant mailen</label>
      <p class="small muted" id="ap-mails" style="margin:0"></p>
    </div>
    <div class="ap-day"><h4 id="ap-dayname"></h4><div id="ap-day"><div class="skel"></div></div><div id="ap-clash"></div>
      <p class="small muted" style="margin:6px 0 0">Klik op een tijd om de afspraak daar te zetten.</p></div></div>`;
  const footLeft = u ? `<button type="button" class="btn danger ap-foot-left" id="ap-del">Afspraak verwijderen</button>` : '';
  sheet(u ? 'Afspraak wijzigen' : 'Nieuwe afspraak', html, 'Bewaar', async (f) => {
    const { s: S0, e: E0 } = times(f);
    if (!(E0 > S0)) { toast('De eindtijd moet na de begintijd liggen'); return false; }
    const online = f.online.checked, notify = f.notify.checked, location = f.location.value.trim();
    if (!online && notify && !location) { toast('Vul het adres in voor een afspraak op locatie'); f.location.focus(); return false; }
    addGuest();
    const r = await act('plan_closing', {
      lead_id: l.id, meeting_at: S0.toISOString(), end_at: E0.toISOString(), mode: online ? 'online' : 'offline', location,
      title: f.title.value.trim(), description: f.description.value, guests: st.guests, notify,
      reminder: f.reminder.value === '' ? null : Number(f.reminder.value),
    });
    if (!r) return false;
    toast(u ? 'Afspraak gewijzigd' : 'Afspraak ingepland');
    agendaCache = null;
    await after(l.id);
    return true;
  }, { wide: true, footLeft });

  const f = $('#sheet form');
  const times = (form) => {
    const s = new Date(`${form.date.value}T${form.ts.value}`);
    let e = new Date(`${form.date.value}T${form.te.value}`);
    return { s, e };
  };
  let lenMin = Math.round((end - start) / 6e4);
  const days = await agendaDays();
  const guestsEl = $('#ap-guests');
  const drawGuests = () => {
    guestsEl.innerHTML = st.guests.map((g) => `<span class="ap-guest">${esc(g)}<button type="button" data-rm-guest="${esc(g)}" aria-label="Verwijder">${icon('x')}</button></span>`).join('');
  };
  const addGuest = () => {
    const v = $('#ap-guest').value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) || st.guests.includes(v) || v === (d.email || '').toLowerCase()) return;
    st.guests.push(v); $('#ap-guest').value = ''; drawGuests();
  };
  const draw = () => {
    const { s: s1, e: e1 } = times(f);
    if (isNaN(s1) || isNaN(e1)) return;
    lenMin = Math.round((e1 - s1) / 6e4);
    document.querySelectorAll('#ap-dur .ap-chip').forEach((c) => c.classList.toggle('on', Number(c.dataset.dur) === lenMin));
    const items = (days.find((x) => x.date === dayKey(s1))?.items || []).filter((i) => i.id !== u?.event_id);
    const tl = timelineHtml(items, s1, e1);
    const keep = $('#ap-tl')?.scrollTop;
    $('#ap-dayname').textContent = `Je agenda · ${new Intl.DateTimeFormat('nl-NL', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long' }).format(s1)}`;
    $('#ap-day').innerHTML = tl.html;
    $('#ap-tl').scrollTop = keep ?? Math.max(0, ((tzMin(s1) / 60) - AP_FIRST - 1) * AP_H);
    const over = items.filter((i) => !i.all_day && i.busy && new Date(i.start) < e1 && new Date(i.end) > s1);
    const blocked = items.some((i) => i.all_day && i.kind === 'block');
    $('#ap-clash').innerHTML = [blocked ? `<div class="ap-warn">${icon('alert')} Je staat deze dag op niet beschikbaar</div>` : '',
      ...over.map((i) => `<div class="ap-warn">${icon('alert')} Overlapt met ${esc(i.title)} (${time(new Date(i.start))}–${time(new Date(i.end))})</div>`)].join('');
    const online = f.online.checked;
    f.location.placeholder = online ? 'Locatie (optioneel)' : 'Adres';
    const loc = f.location.value.trim();
    $('#ap-map').style.display = loc ? '' : 'none';
    $('#ap-map').href = loc ? mapsHref(loc) : '#';
    $('#ap-mails').textContent = !d.email ? 'Zonder e-mailadres krijgt de klant geen uitnodiging of mails.'
      : !f.notify.checked ? 'De klant krijgt geen uitnodiging en geen mails. Alleen jij ziet de afspraak.'
      : `Uitnodiging van Google en meteen een bevestiging, om 19:00 de avond ervoor een herinnering en ${online ? '20 minuten van tevoren de Meet-link' : 'op de dag zelf om 08:00 een "tot straks" met het adres'}.`;
  };
  const setStart = (s1) => {
    const e1 = new Date(s1.getTime() + lenMin * 6e4);
    f.date.value = localInput(s1).slice(0, 10); f.ts.value = localInput(s1).slice(11); f.te.value = localInput(e1).slice(11);
    draw();
  };
  f.ts.addEventListener('change', () => { const s1 = new Date(`${f.date.value}T${f.ts.value}`); if (!isNaN(s1)) setStart(s1); });
  f.date.addEventListener('change', () => { const s1 = new Date(`${f.date.value}T${f.ts.value}`); if (!isNaN(s1)) setStart(s1); });
  f.te.addEventListener('change', draw);
  f.online.addEventListener('change', () => { if (!f.online.checked && !f.location.value) f.location.value = f.location.dataset.default; draw(); });
  f.notify.addEventListener('change', draw);
  f.location.addEventListener('input', draw);
  $('#ap-dur').addEventListener('click', (e) => {
    const c = e.target.closest('[data-dur]'); if (!c) return;
    lenMin = Number(c.dataset.dur);
    setStart(times(f).s);
  });
  $('#ap-day').addEventListener('click', (e) => {
    const inner = e.target.closest('#ap-tl-in'); if (!inner) return;
    const y = e.clientY - inner.getBoundingClientRect().top;
    const mins = Math.max(AP_FIRST * 60, Math.min((AP_LAST - 1) * 60, Math.round((y / AP_H) * 60 / 15) * 15 + AP_FIRST * 60));
    const s1 = new Date(`${f.date.value}T${String(Math.floor(mins / 60)).padStart(2, '0')}:${String(mins % 60).padStart(2, '0')}`);
    setStart(s1);
  });
  guestsEl.addEventListener('click', (e) => { const b = e.target.closest('[data-rm-guest]'); if (b) { st.guests = st.guests.filter((g) => g !== b.dataset.rmGuest); drawGuests(); } });
  $('#ap-guest-add').addEventListener('click', addGuest);
  $('#ap-guest').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); addGuest(); } });
  $('#ap-del')?.addEventListener('click', async () => {
    const tell = st.notify && d.email ? confirm('Afspraak verwijderen. De klant laten weten dat hij niet doorgaat?\n\nOK = verwijderen en klant laten weten · Annuleer = kies hierna "alleen uit mijn agenda"') : false;
    if (!tell && !confirm('Alleen uit je agenda verwijderen, zonder bericht aan de klant?')) return;
    if (await act('cancel_closing', { lead_id: l.id, notify: tell })) {
      toast('Afspraak verwijderd'); agendaCache = null; $('#sheet').close(); await after(l.id);
    }
  });
  drawGuests();
  draw();
}

const TASKS = {}; // task id → task row, for the buttons in Vandaag and the lead panel

/** A modal form. fields() is HTML; onOk(form) returns true to close. */
function sheet(title, html, okLabel, onOk, { danger = false, wide = false, footLeft = '', cancelLabel = 'Annuleer' } = {}) {
  const d = $('#sheet');
  d.classList.toggle('wide', wide);
  d.innerHTML = `<form method="dialog"><div class="sh-head"><h3>${esc(title)}</h3><button type="button" class="btn icon" data-sheet-close aria-label="Sluiten">${icon('x')}</button></div>
    <div class="sh-body">${html}</div>
    <div class="sh-foot">${footLeft}<button type="button" class="btn" data-sheet-close>${esc(cancelLabel)}</button><button type="submit" class="btn ${danger ? 'danger' : 'primary'}" id="sheet-ok">${esc(okLabel)}</button></div></form>`;
  d.querySelector('form').onsubmit = async (e) => {
    e.preventDefault();
    const ok = $('#sheet-ok');
    ok.disabled = true;
    try { if (await onOk(d.querySelector('form'))) d.close(); } finally { ok.disabled = false; }
  };
  d.showModal();
  d.querySelector('input:not([type=radio]), select, textarea')?.focus();
}
document.addEventListener('click', (e) => { if (e.target.closest('[data-sheet-close]')) $('#sheet').close(); });

/** After a change: reload everything, keep the lead panel open. */

const whenField = (label, d, name = 'when') => `<label class="fld">${label}<input type="datetime-local" name="${name}" value="${localInput(d)}" min="${localInput(new Date())}" required></label>`;
const isoOf = (v) => new Date(v).toISOString();
const inDays = (n, h = 10) => { const d = new Date(); d.setDate(d.getDate() + n); d.setHours(h, 0, 0, 0); return d; };
/** "Terugbellen inplannen": day + time, quick picks, a note. Name 'when' so the quick picks fill it. */
const callbackFields = (label = 'Terugbellen op', help = 'Staat die dag in Vandaag onder Bellen, met een melding. De status blijft zoals hij is. Weekend of \'s nachts schuift naar het volgende werkmoment.') => `${whenField(label, inDays(1, 9))}
  <div class="note-row"><button type="button" class="qp" data-set-when="${localInput(inDays(1, 9))}">Morgen 9:00</button><button type="button" class="qp" data-set-when="${localInput(inDays(7))}">Over 1 week</button><button type="button" class="qp" data-set-when="${localInput(inDays(14))}">Over 2 weken</button><button type="button" class="qp" data-set-when="${localInput(inDays(21))}">Over 3 weken</button></div>
  <label class="fld">Notitie<textarea name="cbnote" placeholder="Waarover? (optioneel)"></textarea></label>
  <p class="small muted">${help}</p>`;
/** "Volgende stap" after Gedaan on a task nothing follows by itself (as in the app): Opnieuw contact or Terugbellen, or Geen. */
function nextStep(leadId, name) {
  return sheet(`Volgende stap · ${name}`, `<div class="opts"><label><input type="radio" name="next" value="contact" checked> Opnieuw contact</label><label><input type="radio" name="next" value="bellen"> Terugbellen</label></div>
    ${callbackFields('Wanneer', 'Staat die dag in Vandaag (onder Opnieuw contact opnemen of Bellen), met een melding. De status blijft zoals hij is. Weekend of \'s nachts schuift naar het volgende werkmoment.')}`, 'Plan in', async (f) => {
    if (f.next.value === 'bellen') {
      const ok = await planCallback(leadId, f);
      if (ok) await after(leadId);
      return ok;
    }
    const r = await act('plan_recontact', { lead_id: leadId, at: isoOf(f.when.value), note: f.cbnote.value.trim() || null, source: 'web' });
    if (r) { toast(`Opnieuw contact: ${due(r.due_at || isoOf(f.when.value))}`); await after(leadId); }
    return !!r;
  }, { cancelLabel: 'Geen' });
}
async function planCallback(id, f) {
  const r = await act('plan_callback', { lead_id: id, callback_at: isoOf(f.when.value), note: f.cbnote.value.trim() || null, source: 'web' });
  if (r) toast(`Terugbellen: ${due(r.due_at || isoOf(f.when.value))}`);
  return !!r;
}

function taskActs(t) {
  TASKS[t.id] = { ...(TASKS[t.id] || {}), ...t };
  const b = (a, label, cls = '') => `<button class="btn small ${cls}" data-task="${t.id}" data-ta="${a}">${label}</button>`;
  const out = [];
  if (t.kind === 'send_first' || t.kind === 'send_followup') out.push(b('send', `${icon('send')} Verstuur`, 'primary'));
  if (t.kind === 'call') out.push(b('call', `${icon('doc')} Resultaat`));
  if (['reply', 'prepare_call', 'send_dm', 'recontact'].includes(t.kind)) out.push(b('done', `${icon('check')} Gedaan`));
  out.push(b('later', `${icon('clock')} Later`));
  if (t.kind !== 'call') out.push(b('skip', 'Overslaan'));
  return out.join('');
}

document.addEventListener('click', async (e) => {
  const btn = e.target.closest('[data-ta]');
  if (!btn) return;
  e.stopPropagation();
  const t = TASKS[btn.dataset.task];
  if (!t) return;
  const leadId = t.lead_id;
  const lead = S.leads.find((x) => x.id === leadId) || {};
  const name = t.company || lead.company || '';
  const p = t.payload || {};
  switch (btn.dataset.ta) {
    case 'done':
      btn.disabled = true;
      if (await act('mark_done', { task_id: t.id })) {
        toast('Gedaan');
        await after(leadId);
        if (['reply', 'recontact', 'prepare_call'].includes(t.kind)) nextStep(leadId, name);
      }
      btn.disabled = false;
      return;
    case 'skip':
      if (!confirm(`${taskLabel(t)} voor ${name} overslaan?`)) return;
      if (await act('skip', { task_id: t.id })) { toast('Overgeslagen'); await after(leadId); }
      return;
    case 'later':
      return sheet(`Later · ${name}`, `${whenField('Wanneer weer oppakken', tomorrowNine())}
        <div class="note-row"><button type="button" class="qp" data-set-when="${localInput(inAnHour())}">Over 1 uur</button><button type="button" class="qp" data-set-when="${localInput(tomorrowNine())}">Morgen 9:00</button></div>
        <p class="small muted">Nooit in het weekend of 's nachts: dan schuift het naar het volgende werkmoment.</p>`, 'Bewaar', async (f) => {
        const r = await act('snooze', { task_id: t.id, until: isoOf(f.when.value) });
        if (r) { toast(`Verzet naar ${due(r.due_at || isoOf(f.when.value))}`); await after(leadId); }
        return !!r;
      });
    case 'send': {
      const first = t.kind === 'send_first';
      sheet(first ? `Verstuur · ${name}` : `${taskLabel(t)} · ${name}`, `<label class="fld">Van<select name="from" disabled><option>Laden…</option></select></label>
        <div class="fld">Aan<span style="color:var(--ink);font-weight:400">${esc(p.to || t.email || lead.email || '–')}</span></div>
        <div class="fld">Onderwerp<span style="color:var(--ink);font-weight:400">${esc(p.subject || `Een video voor ${name}`)}</span></div>
        <div class="fld">Bericht<pre class="preview">${esc(p.text || 'De mail met de video, precies zoals hij in je Gmail-concepten staat.')}</pre></div>
        <p class="small muted">${first ? 'Het concept uit Gmail gaat zoals het is, alleen het afzender-adres wordt ingevuld.' : 'Gaat als antwoord in dezelfde mailthread, vanaf de mailbox van de eerste mail.'}</p>`, 'Verstuur', async (f) => {
        const body = { task_id: t.id };
        if (first) body.from = f.from.value;
        const r = await act('send_draft', body);
        if (r) { toast(`Verstuurd${r.from ? ` vanaf ${r.from}` : ''}`); await after(leadId); }
        return !!r;
      });
      const sel = $('#sheet select[name=from]'), ok = $('#sheet-ok');
      ok.disabled = true;
      const r = await act('sender_options', { task_id: t.id });
      if (!r || !$('#sheet').open) return;
      if (r.fixed) sel.innerHTML = `<option>${esc(r.fixed)}</option>`;
      else {
        sel.innerHTML = (r.options || []).map((o) => `<option value="${esc(o.email)}" ${o.email === r.suggested ? 'selected' : ''} ${o.room > 0 ? '' : 'disabled'}>${esc(o.email)} · ${o.room > 0 ? `nog ${o.room} vandaag` : 'vol'}</option>`).join('');
        sel.disabled = false;
      }
      ok.disabled = !r.fixed && !r.suggested;
      if (!r.fixed && !r.suggested) toast('Alle mailboxen zitten vandaag vol');

    }
    case 'call':
      return sheet(`Hoe ging het? · ${name}`, `<div class="opts">
          ${[['afspraak', 'Intake gepland'], ['terugbellen', 'Terugbellen'], ['geen_gehoor', 'Geen gehoor'], ['voicemail', 'Voicemail'], ['geen_interesse', 'Geen interesse']]
            .map(([v, l]) => `<label><input type="radio" name="outcome" value="${v}" required> ${l}</label>`).join('')}</div>
        <div id="call-when" hidden>${whenField('Wanneer', tomorrowNine())}<label class="remind" id="call-self" style="margin-top:8px"><input type="checkbox" name="self"> Ze plannen zelf via de link</label></div>
        <label class="fld">Notitie<textarea name="note" placeholder="Wat werd er gezegd?"></textarea></label>`, 'Bewaar', async (f) => {
        const outcome = f.outcome.value, note = f.note.value.trim();
        // "Ze plannen zelf": the engine closes every open call (a planned call back too) and the lead goes to Reactie.
        const body = { task_id: t.id, outcome };

        if (outcome === 'terugbellen') body.callback_at = isoOf(f.when.value);
        const r = await act('log_call', body);
        if (r) { toast('Belresultaat bewaard'); await after(leadId); }

});

function manageCard(l) {

document.addEventListener('click', async (e) => {

    return sheet(`Contact · ${l.company}`, `<div class="ed">${f('contact_name', 'Naam (Hey …)')}${f('phone', 'Telefoon', 'tel')}${f('email', 'E-mail', 'email')}${f('instagram', 'Instagram')}${f('facebook', 'Facebook')}${f('website', 'Website')}</div>`, 'Bewaar', async (form) => {

        <p class="small muted">Een stap in de reeks (follow-up, bellen) wordt bij de volgende ronde van de engine klaargezet. Geen interesse = nooit meer contact.</p>
        <label class="remind" style="margin-top:4px"><input type="checkbox" name="cb"> Terugbellen inplannen</label>

          const r = await act('set_status', { lead_id: id, status: s });
          if (!r) return false;

        }

        await after(id);
        return ok;
      });
    case 'later':

        <p class="small muted">De lead gaat op Gestald: de reeks en geplande belletjes stoppen, hij wordt niet geblokkeerd. Die dag staat hij in Vandaag onder Opnieuw contact opnemen, met een melding.</p>`, 'Stallen', async (f) => {

    case 'recontact':
      return sheet(`Opnieuw contact · ${l.company}`, callbackFields('Contact opnemen op', 'Staat die dag in Vandaag onder Opnieuw contact opnemen, met een melding. Dan kies jij: bellen, mailen of een DM, en tik je Gedaan. De status blijft zoals hij is.'), 'Plan in', async (f) => {

      });

    case 'intake':

        const r = await act('set_meeting', { lead_id: id, meeting_at: isoOf(f.when.value) });

    case 'delete':
      return sheet(`${l.company} verwijderen?`, `<p>De lead, zijn taken en geschiedenis verdwijnen. Het concept in Gmail blijft staan, maar wordt niet opnieuw een lead.</p>
        <label class="fld">Typ <b style="color:var(--ink)">${esc(l.slug)}</b> om te bevestigen<input name="confirm" autocomplete="off" required></label>`, 'Verwijder lead', async (f) => {

// ───────────── Script (settings.scripts) ─────────────
// Jiang's call scripts, editable here and in the app. { intake: { title, sections: [{ id, title, hint }] } }
const DEFAULT_SCRIPTS = { intake: { title: 'Intake', sections: [] } };
const scripts = () => S.settings.scripts || DEFAULT_SCRIPTS;
const intakeSections = () => scripts().intake?.sections || [];
const hintLines = (h) => String(h || '').split('\n').map((x) => x.trim()).filter(Boolean);
const newId = () => 's' + Math.random().toString(36).slice(2, 8);
let scriptDraft = null; // sections being edited, or null when just reading

function renderScript() {
  const view = $('#v-script');
  const secs = scriptDraft || intakeSections();
  const head = `<div class="hello"><h1>Script</h1><p>Je leidraad voor gesprekken. Wat je hier aanpast staat meteen ook in de app.</p></div>`;
  if (!scriptDraft) {
    view.innerHTML = `${head}
      <div class="card"><div class="script-head"><h2 style="margin:0">Intake</h2><span class="faint small">${secs.length} onderdelen</span><div class="spacer"></div><button class="btn" data-script-edit>${icon('note')} Bewerken</button></div>
      ${secs.length ? secs.map((x, i) => `<div class="sec"><div class="nr">${i + 1}</div><div><h3>${esc(x.title)}</h3>${hintLines(x.hint).length ? `<ul>${hintLines(x.hint).map((h) => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}</div></div>`).join('')
        : '<p class="muted">Nog leeg. Klik op Bewerken om onderdelen toe te voegen.</p>'}</div>`;
    return;
  }
  view.innerHTML = `${head}
    <div class="card"><div class="script-head"><h2 style="margin:0">Intake bewerken</h2><div class="spacer"></div>
      <button class="btn" data-script-cancel>Annuleer</button><button class="btn primary" data-script-save>Opslaan</button></div>
    ${secs.map((x, i) => `<div class="sec-edit" data-i="${i}">
        <input value="${esc(x.title)}" data-f="title" placeholder="Onderdeel, bijv. Wie zijn ze">
        <div class="tools">
          <button class="btn icon" data-script-up="${i}" title="Omhoog" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="btn icon" data-script-down="${i}" title="Omlaag" ${i === secs.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="btn icon" data-script-del="${i}" title="Verwijder">${icon('x')}</button>
        </div>
        <textarea rows="3" data-f="hint" placeholder="Vragen, één per regel">${esc(x.hint)}</textarea>
      </div>`).join('')}
    <button class="btn" data-script-add style="margin-top:12px">+ Onderdeel toevoegen</button></div>`;
}

// Copies what's typed into the draft before a re-render (move, add, delete).
function syncScriptDraft() {
  for (const row of document.querySelectorAll('.sec-edit')) {
    const x = scriptDraft[Number(row.dataset.i)];
    x.title = row.querySelector('[data-f=title]').value;
    x.hint = row.querySelector('[data-f=hint]').value;
  }
}

async function saveScript() {
  syncScriptDraft();
  const sections = scriptDraft.map((x) => ({ id: x.id, title: x.title.trim(), hint: x.hint.trim() })).filter((x) => x.title || x.hint)
    .map((x) => ({ ...x, title: x.title || 'Zonder titel' }));
  const value = { ...scripts(), intake: { ...(scripts().intake || {}), title: 'Intake', sections } };
  if (!MOCK) {
    const { error } = await sb.from('settings').update({ value }).eq('key', 'scripts');
    if (error) { toast('Opslaan lukte niet. Probeer het zo nog eens.'); return; }
  }
  S.settings.scripts = value;
  scriptDraft = null;
  renderScript();
  toast('Script opgeslagen');
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-script-edit],[data-script-cancel],[data-script-save],[data-script-add],[data-script-up],[data-script-down],[data-script-del]');
  if (!t) return;
  const d = t.dataset;
  if (d.scriptEdit != null) { scriptDraft = structuredClone(intakeSections()); renderScript(); return; }
  if (d.scriptCancel != null) { scriptDraft = null; renderScript(); return; }
  if (d.scriptSave != null) { saveScript(); return; }
  syncScriptDraft();
  if (d.scriptAdd != null) scriptDraft.push({ id: newId(), title: '', hint: '' });
  const swap = (a, b) => { [scriptDraft[a], scriptDraft[b]] = [scriptDraft[b], scriptDraft[a]]; };
  if (d.scriptUp) swap(Number(d.scriptUp), Number(d.scriptUp) - 1);
  if (d.scriptDown) swap(Number(d.scriptDown), Number(d.scriptDown) + 1);
  if (d.scriptDel) scriptDraft.splice(Number(d.scriptDel), 1);
  renderScript();
  if (d.scriptAdd != null) [...document.querySelectorAll('.sec-edit input')].pop()?.focus();
});

// ───────────── Intake per lead (lead_intakes) ─────────────
// answers: { <section id>: { title, text } }; the title is kept so an answer survives a renamed or removed question.
let intakeState = { leadId: null, row: null };
let intakeTimer = null;

async function loadIntake(id) {
  if (MOCK) return (mockData.intakes || {})[id] || null;
  const r = await sb.from('lead_intakes').select('*').eq('lead_id', id).maybeSingle();
  return r.data || null;
}

function intakeProgress(row) {
  const secs = intakeSections();
  const filled = secs.filter((x) => row?.answers?.[x.id]?.text?.trim()).length;
  return { filled, total: secs.length, story: !!row?.story?.trim() };
}

function intakeCard() {
  const row = intakeState.row, p = intakeProgress(row);
  const sub = row ? `${p.filled} van ${p.total} ingevuld${p.story ? ' · verhaal' : ''} · bewerkt ${rel(row.updated_at)}` : 'Nog niet ingevuld';
  return `<h2>Intake</h2><div class="intake-sum">
    <div class="meter"><span style="width:${p.total ? (p.filled / p.total) * 100 : 0}%"></span></div>
    <span class="small muted">${sub}</span>
    <button class="btn primary" data-intake-open>${icon('doc')} ${row ? 'Open intake' : 'Start intake'}</button></div>`;
}

function openIntake() {
  const l = S.leads.find((x) => x.id === intakeState.leadId);
  if (!l) return;
  const row = intakeState.row || { answers: {}, story: '' };
  const secs = intakeSections();
  const known = new Set(secs.map((x) => x.id));
  const old = Object.entries(row.answers || {}).filter(([id, a]) => !known.has(id) && a?.text?.trim());
  const q = (id, title, hint, text, i) => `<div class="q" data-q="${esc(id)}" data-title="${esc(title)}">
      <h3><span class="nr">${i}</span>${esc(title)}</h3>${hint ? `<div class="hint">${esc(hint)}</div>` : ''}
      <textarea data-answer placeholder="Wat vertellen ze…">${esc(text || '')}</textarea></div>`;
  $('#intake').innerHTML = `
    <div class="intake-top"><button class="btn icon" data-intake-close aria-label="Sluiten">${icon('x')}</button>
      <h2>Intake · ${esc(l.company)}</h2><span class="saved" id="intake-saved">${intakeState.row ? `Opgeslagen ${rel(intakeState.row.updated_at)}` : ''}</span></div>
    <div class="intake">
      ${secs.map((x, i) => q(x.id, x.title, x.hint, row.answers?.[x.id]?.text, i + 1)).join('')}
      ${old.length ? `<p class="faint small" style="margin:6px 0 10px">Uit een eerdere versie van het script</p>${old.map(([id, a]) => q(id, a.title || 'Vraag', '', a.text, '·').replace('class="q"', 'class="q old"')).join('')}` : ''}
      <div class="q story"><h3><span class="nr">${icon('note')}</span>Hun verhaal &amp; overige notities</h3>
        <div class="hint">Alles wat ze hebben meegemaakt en wat verder opviel.</div>
        <textarea data-story placeholder="Hun verhaal…">${esc(row.story || '')}</textarea></div>
      <p class="faint small">Wordt vanzelf opgeslagen. De vragen pas je aan onder Script.</p>
    </div>`;
  $('#intake').classList.add('open');
  document.body.style.overflow = 'hidden';
  for (const ta of document.querySelectorAll('#intake textarea')) grow(ta);
  $('#intake textarea')?.focus();
}

function grow(ta) { ta.style.height = 'auto'; ta.style.height = `${ta.scrollHeight + 2}px`; }

async function saveIntake() {
  clearTimeout(intakeTimer); intakeTimer = null;
  const id = intakeState.leadId;
  if (!id || !$('#intake').classList.contains('open')) return;
  const answers = { ...(intakeState.row?.answers || {}) };
  for (const qd of document.querySelectorAll('#intake .q[data-q]')) {
    answers[qd.dataset.q] = { title: qd.dataset.title, text: qd.querySelector('textarea').value };
  }
  const row = { lead_id: id, answers, story: $('#intake [data-story]').value, updated_at: new Date().toISOString() };
  $('#intake-saved').textContent = 'Opslaan…';
  if (!MOCK) {
    const { error } = await sb.from('lead_intakes').upsert(row);
    if (error) { $('#intake-saved').textContent = 'Opslaan lukte niet'; toast('Intake opslaan lukte niet. Probeer het zo nog eens.'); return; }
  } else {
    (mockData.intakes = mockData.intakes || {})[id] = row;
  }
  intakeState.row = row;
  if (intakeState.leadId === id) $('#intake-saved').textContent = `Opgeslagen ${time(new Date())}`;
}

async function closeIntake() {
  if (intakeTimer) await saveIntake();
  $('#intake').classList.remove('open');
  if (!$('#prep').classList.contains('open')) document.body.style.overflow = '';
  const card = $('#intake-card');
  if (card) card.innerHTML = intakeCard();
}

document.addEventListener('input', (e) => {
  if (!e.target.closest('#intake') || e.target.tagName !== 'TEXTAREA') return;
  grow(e.target);
  $('#intake-saved').textContent = 'Wijzigingen…';
  clearTimeout(intakeTimer);
  intakeTimer = setTimeout(saveIntake, 900);
});
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-intake-open]')) openIntake();
  if (e.target.closest('[data-intake-close]')) closeIntake();
});
window.addEventListener('beforeunload', (e) => { if (intakeTimer) { saveIntake(); e.preventDefault(); } });

      return;
    }

  if (tab === 'video') UI.videoOpen = arg === 'open';
  if (tab === 'apollo') window.apolloRoute?.(h.split('/').slice(1));
  if (tab === 'leads') UI.stage = STAGES.some((s) => s.id === arg) ? arg : (arg === undefined ? UI.stage : null);

if (MOCK) {

} else {
  // The link from the login mail: #login=<token_hash>. Exchange it once, then drop it from the address bar.
  const tokenHash = new URLSearchParams(location.hash.slice(1)).get('login');
  if (tokenHash) {

    if (session) setTimeout(start, 0);
    else if (!tokenHash && (event === 'SIGNED_OUT' || event === 'INITIAL_SESSION')) showLogin('');
  });
}
