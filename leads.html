<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script>try { const t = localStorage.getItem('sw-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<title>SW Lead Engine</title>
<link rel="icon" href="/site/media/favicon.png">
<link rel="apple-touch-icon" href="/site/media/apple-touch-icon.png">
<!--
  SW Lead Engine on the desktop: the same data as the SW Leads iOS app (Supabase project sw-lead-engine).
  Read-only overview. Sign-in: the web-login edge function mails a one-time link (#login=<token_hash>) to the
  owner's own address. Row level security only lets the owner uid read anything, so the publishable key below
  is safe in a public file (it also ships in the app).
-->
<style>
:root {
  --blue: #0071E3; --soft-blue: #E8F1FF;
  --ink: #1D1D1F; --muted: #6E6E73; --faint: #86868B;
  --bg: #F5F5F7; --card: #FFFFFF; --line: rgba(0,0,0,.08); --hover: rgba(0,0,0,.035);
  --green: #1FA54A; --green-bg: rgba(52,199,89,.14);
  --orange: #E08600; --orange-bg: rgba(255,149,0,.15);
  --red: #E5352B; --red-bg: rgba(255,59,48,.12);
  --grey-bg: rgba(142,142,147,.16);
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 18px rgba(0,0,0,.05);
  --radius: 18px;
}
/* Dark follows the system unless the toggle picked one (html[data-theme], remembered per browser). */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --blue: #0A84FF; --soft-blue: #0A2A4D;
    --ink: #F5F5F7; --muted: #AEAEB2; --faint: #8E8E93;
    --bg: #000000; --card: #1C1C1E; --line: rgba(255,255,255,.09); --hover: rgba(255,255,255,.05);
    --green: #32D74B; --orange: #FF9F0A; --red: #FF453A;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --blue: #0A84FF; --soft-blue: #0A2A4D;
  --ink: #F5F5F7; --muted: #AEAEB2; --faint: #8E8E93;
  --bg: #000000; --card: #1C1C1E; --line: rgba(255,255,255,.09); --hover: rgba(255,255,255,.05);
  --green: #32D74B; --orange: #FF9F0A; --red: #FF453A;
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--ink); min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, select { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 13px; }

/* ── Login ── */
#login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.login-card {
  width: 100%; max-width: 380px; background: var(--card); border-radius: 24px; padding: 36px 32px;
  box-shadow: var(--shadow); text-align: center;
}
.login-card img { width: 56px; height: 56px; border-radius: 14px; margin-bottom: 16px; }
.login-card h1 { font-size: 24px; letter-spacing: -.02em; }
.login-card p { color: var(--muted); margin: 6px 0 22px; }
.field {
  width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); outline: none;
}
.field:focus { border-color: var(--blue); box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 20%, transparent); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 14px; border-radius: 999px; font-weight: 600; font-size: 14px;
  background: var(--hover); transition: background .15s, transform .1s;
}
.btn:hover { background: var(--line); text-decoration: none; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--blue); color: #fff; }
.btn.primary:hover { background: color-mix(in srgb, var(--blue) 88%, #000); }
.btn.block { width: 100%; padding: 12px; margin-top: 12px; font-size: 15px; }
.btn.icon { padding: 8px; }
.login-msg { margin-top: 14px; font-size: 14px; }
.login-msg.err { color: var(--red); }

/* ── Shell ── */
.top {
  position: sticky; top: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--line);
}
.top-inner { max-width: 1240px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.brand img { width: 30px; height: 30px; border-radius: 8px; }
.tabs { display: flex; gap: 4px; background: var(--hover); padding: 4px; border-radius: 999px; }
.tabs a {
  padding: 6px 14px; border-radius: 999px; color: var(--muted); font-weight: 600; font-size: 14px;
  display: flex; align-items: center; gap: 6px;
}
.tabs a:hover { text-decoration: none; color: var(--ink); }
.tabs a.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.badge { background: var(--orange); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; font-weight: 700; }
.spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px;
  font-size: 12.5px; font-weight: 600; background: var(--green-bg); color: var(--green); white-space: nowrap;
}
.pill.bad { background: var(--red-bg); color: var(--red); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill:not(.bad) .dot { animation: pulse 2.4s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
main { max-width: 1240px; margin: 0 auto; padding: 28px 24px 80px; }

/* ── Cards / grid ── */
.hello { margin-bottom: 22px; }
.hello h1 { font-size: 32px; letter-spacing: -.025em; line-height: 1.15; }
.hello p { color: var(--muted); margin-top: 4px; font-size: 16px; }
.grid { display: grid; gap: 16px; }
.g-kpi { grid-template-columns: repeat(5, 1fr); }
.g-2 { grid-template-columns: 1.35fr 1fr; }
.g-3 { grid-template-columns: repeat(3, 1fr); }
.card { background: var(--card); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); min-width: 0; }
.card h2 { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.card h2 .sub { font-weight: 500; color: var(--faint); font-size: 13px; margin-left: auto; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.kpi .v { font-size: 34px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.kpi .l { font-weight: 600; margin-top: 2px; }
.kpi .c { color: var(--faint); font-size: 13px; }
.kpi .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; margin-bottom: 12px; }
.ic.blue { background: var(--soft-blue); color: var(--blue); }
.ic.green { background: var(--green-bg); color: var(--green); }
.ic.orange { background: var(--orange-bg); color: var(--orange); }
.ic.red { background: var(--red-bg); color: var(--red); }

.banner {
  display: flex; gap: 12px; align-items: flex-start; background: var(--red-bg); color: var(--ink);
  border-radius: 14px; padding: 14px 16px; margin-bottom: 18px;
}
.banner svg { color: var(--red); margin-top: 2px; }
.banner b { display: block; }

.watch {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; margin-bottom: 12px;
  background: linear-gradient(100deg, var(--green-bg), transparent 80%); cursor: pointer;
}
.live { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 var(--green); animation: ring 1.8s infinite; flex: none; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--green) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }

/* Funnel */
.funnel { display: flex; flex-direction: column; gap: 11px; }
.frow { display: grid; grid-template-columns: 120px 1fr 92px; align-items: center; gap: 12px; }
.frow .bar { height: 26px; background: var(--hover); border-radius: 8px; overflow: hidden; }
.frow .bar span { display: block; height: 100%; border-radius: 8px; background: var(--blue); min-width: 3px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.frow .n { text-align: right; font-weight: 700; }
.frow .n small { color: var(--faint); font-weight: 500; margin-left: 4px; }

/* Pipeline */
.pipe { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; }
.stage {
  border-radius: 14px; padding: 12px 10px; background: var(--hover); text-align: left; transition: background .15s;
}
.stage:hover { background: var(--line); text-decoration: none; }
.stage .v { font-size: 24px; font-weight: 700; letter-spacing: -.02em; color: var(--ink); }
.stage .l { font-size: 12.5px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stage.hot .v { color: var(--orange); }
.stage.good .v { color: var(--green); }

/* Bars (7 days) */
.bars { display: flex; align-items: flex-end; gap: 10px; height: 130px; padding-top: 18px; }
.bars .b { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
.bars .col { width: 100%; max-width: 38px; background: var(--blue); border-radius: 7px 7px 3px 3px; position: relative; min-height: 3px; }
.bars .col.zero { background: var(--line); }
.bars .col em { position: absolute; top: -18px; left: 0; right: 0; text-align: center; font-style: normal; font-size: 12px; font-weight: 700; }
.bars .d { font-size: 12px; color: var(--faint); font-weight: 600; }
.bars .b.today .d { color: var(--blue); }

/* Mailboxes */
.mbox { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.mbox:first-of-type { border-top: 0; padding-top: 0; }
.mbox .meter { grid-column: 1 / -1; height: 6px; border-radius: 6px; background: var(--hover); overflow: hidden; }
.mbox .meter span { display: block; height: 100%; background: var(--blue); border-radius: 6px; }
.mbox .meter span.full { background: var(--orange); }
.mbox b { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }

/* Week */
.week { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 6px; }
.week div { background: var(--hover); border-radius: 12px; padding: 10px 12px; }
.week .v { font-size: 22px; font-weight: 700; }
.week .l { font-size: 12.5px; color: var(--muted); font-weight: 600; }

/* Chips */
.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 650; white-space: nowrap;
}
.st-green { color: var(--green); background: var(--green-bg); }
.st-orange { color: var(--orange); background: var(--orange-bg); }
.st-red { color: var(--red); background: var(--red-bg); }
.st-grey { color: var(--muted); background: var(--grey-bg); }
.st-blue { color: var(--blue); background: var(--soft-blue); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--blue); }

/* Today */
.tgroup { margin-bottom: 26px; }
.tgroup > h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); margin: 0 0 10px 4px; }
.task { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 16px 18px; margin-bottom: 10px; }
.task .tic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; }
.task .tic svg { width: 20px; height: 20px; }
.task h4 { font-size: 16px; font-weight: 650; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.task .meta { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.task .acts { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.task .late { color: var(--red); font-weight: 600; }
details.script { grid-column: 2 / -1; font-size: 14px; }
details.script summary { cursor: pointer; color: var(--blue); font-weight: 600; font-size: 13.5px; list-style: none; }
details.script summary::-webkit-details-marker { display: none; }
details.script pre { white-space: pre-wrap; font: inherit; background: var(--hover); border-radius: 12px; padding: 12px 14px; margin-top: 8px; }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty svg { width: 40px; height: 40px; color: var(--green); margin-bottom: 10px; stroke-width: 1.6; }
.empty b { display: block; color: var(--ink); font-size: 18px; }

/* Leads table */
.toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.search { position: relative; flex: 1; min-width: 220px; max-width: 360px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.search input { width: 100%; padding: 9px 12px 9px 36px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); outline: none; }
.search input:focus { border-color: var(--blue); }
select.sel { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); outline: none; }
.stabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; scrollbar-width: none; }
.stabs button {
  padding: 7px 13px; border-radius: 999px; font-weight: 600; font-size: 13.5px; color: var(--muted);
  background: var(--card); box-shadow: var(--shadow); white-space: nowrap; display: flex; gap: 7px; align-items: center;
}
.stabs button span { color: var(--faint); font-weight: 600; }
.stabs button.on { background: var(--ink); color: var(--bg); }
.stabs button.on span { color: inherit; opacity: .6; }
.stage-sub { color: var(--faint); font-size: 13px; margin: -6px 0 12px 4px; }
.tablewrap { padding: 6px 0; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); font-weight: 650; padding: 10px 14px; white-space: nowrap; }
td { padding: 11px 14px; border-top: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
tbody tr { cursor: pointer; transition: background .1s; }
tbody tr:hover { background: var(--hover); }
td.co b { font-weight: 650; display: flex; align-items: center; gap: 8px; }
td.co div { color: var(--muted); font-size: 12.5px; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
.sig { display: inline-flex; align-items: center; gap: 4px; color: var(--faint); }
.sig.on { color: var(--blue); }
.sig.video.on { color: var(--green); }

/* Drawer */
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
#scrim.open { opacity: 1; pointer-events: auto; }
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); z-index: 50; background: var(--bg);
  transform: translateX(102%); transition: transform .28s cubic-bezier(.2,.8,.2,1); overflow-y: auto;
  box-shadow: -10px 0 40px rgba(0,0,0,.15);
}
#drawer.open { transform: none; }
.dhead { padding: 22px 24px 10px; position: sticky; top: 0; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); z-index: 2; }
.dhead .x { position: absolute; right: 16px; top: 16px; }
.dhead h2 { font-size: 24px; letter-spacing: -.02em; padding-right: 40px; }
.dhead .who { color: var(--muted); margin-top: 2px; }
.dhead .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.dbody { padding: 8px 24px 40px; display: flex; flex-direction: column; gap: 14px; }
.dbody .card { padding: 16px 18px; }
.dbody .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); margin-bottom: 10px; }
.rows > div { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.rows > div svg { margin-top: 3px; }
.rows .k { color: var(--muted); min-width: 110px; }
.quick { display: flex; gap: 8px; flex-wrap: wrap; }
.reply { background: var(--orange-bg); border-radius: 12px; padding: 12px 14px; white-space: pre-wrap; }
.timeline { position: relative; }
.ev { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; padding: 7px 0; align-items: baseline; }
.ev .t { color: var(--faint); font-size: 12.5px; white-space: nowrap; }
.ev.c-blue svg { color: var(--blue); } .ev.c-green svg { color: var(--green); } .ev.c-orange svg { color: var(--orange); }
.ev.c-red svg { color: var(--red); } .ev.c-grey svg { color: var(--faint); }
.note-form { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
.note-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.remind { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.remind input, .remind-edit input {
  padding: 6px 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: inherit; font: inherit; font-size: 13px;
}
.qp { padding: 4px 9px; border-radius: 999px; background: var(--hover); font-size: 12.5px; font-weight: 600; color: var(--muted); }
.qp:hover { color: var(--ink); background: var(--line); }
.note-row .btn.primary { margin-left: auto; }
.note-bell { color: var(--faint); padding: 2px 6px; border-radius: 8px; }
.note-bell:hover { background: var(--hover); color: var(--orange); }
.remind-chip { margin-top: 5px; }
.remind-edit { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
.note-form textarea {
  width: 100%; resize: vertical; min-height: 44px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--bg); outline: none; font: inherit; color: inherit;
}
.note-form textarea:focus { border-color: var(--blue); }
.note { padding: 10px 0; border-top: 1px solid var(--line); }
.note:first-child { border-top: 0; }
.note-meta { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--faint); }
.note-meta .note-bell { margin-left: auto; }
.note-del { color: var(--faint); padding: 2px 7px; border-radius: 8px; font-size: 12px; font-weight: 600; }
.note-del:hover { background: var(--hover); color: var(--red); }
.note-del.confirm { color: #fff; background: var(--red); }
.note-text { white-space: pre-wrap; margin-top: 3px; overflow-wrap: anywhere; }
.skel { background: linear-gradient(90deg, var(--hover), var(--line), var(--hover)); background-size: 200% 100%; animation: sh 1.2s infinite; border-radius: 8px; height: 14px; margin: 8px 0; }
@keyframes sh { to { background-position: -200% 0; } }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px;
  transition: all .2s; z-index: 60; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%); }
.foot { text-align: center; color: var(--faint); font-size: 12.5px; margin-top: 30px; }

/* Script */
.script-head { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.sec { display: grid; grid-template-columns: 34px 1fr; gap: 14px; padding: 18px 0; border-top: 1px solid var(--line); }
.sec:first-child { border-top: 0; padding-top: 4px; }
.sec .nr { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--soft-blue); color: var(--blue); font-weight: 700; }
.sec h3 { font-size: 17px; letter-spacing: -.01em; }
.sec ul { margin: 6px 0 0 18px; color: var(--muted); }
.sec li { margin: 2px 0; }
.sec-edit { display: grid; grid-template-columns: 1fr auto; gap: 8px 10px; padding: 14px 0; border-top: 1px solid var(--line); }
.sec-edit:first-child { border-top: 0; }
.sec-edit input, .sec-edit textarea, .intake textarea {
  width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg);
  color: inherit; font: inherit; outline: none; resize: vertical;
}
.sec-edit input { font-weight: 650; }
.sec-edit input:focus, .sec-edit textarea:focus, .intake textarea:focus { border-color: var(--blue); }
.sec-edit .tools { display: flex; flex-direction: column; gap: 4px; }
.sec-edit .tools .btn { padding: 6px; }
.sec-edit textarea { grid-column: 1; }

/* Intake and Voorbereiding (full screen over the lead panel) */
#intake, #prep { position: fixed; inset: 0; z-index: 70; background: var(--bg); overflow-y: auto; display: none; }
#intake.open, #prep.open { display: block; }
#intake { z-index: 71; } /* the intake can be opened from the Voorbereiding */
.intake-top {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 14px 24px;
  background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--line);
}

// ───────────── Model (mirrors ios/SWLeads/Model/Models.swift) ─────────────
const STATUS = {

  { id: 'bellen', title: 'Bellen', sub: 'Telefoon', st: ['bellen', 'bounced', 'dm'] },
  { id: 'reactie', title: 'Reactie', sub: 'Gereageerd · nog geen intake gepland', st: ['gereageerd'] },
  { id: 'intake', title: 'Intake', sub: 'Intake van 15 minuten gepland · daarna de closing', st: ['intake', 'afspraak'] },
  { id: 'closing', title: 'Closing', sub: 'Closing gepland · daarna klant of niet', st: ['closing'] },
  { id: 'klant', title: 'Klant', sub: 'Klant geworden', st: ['klant'] },
  { id: 'klaar', title: 'Afgerond', sub: 'Afgerond of geen interesse', st: ['afgerond', 'geen_interesse'] },

const stageOf = (status) => STAGES.findIndex((s) => s.st.includes(status));
const KIND = {
  send_first: ['Mail versturen', 'send', 'blue'],

};
const taskLabel = (t) => t.kind === 'send_followup' && Number(t.payload?.round) === 2 ? 'Follow-up 2 versturen'
  : t.kind === 'prepare_call' ? (t.payload?.stage === 'closing' ? 'Closing voorbereiden' : 'Intake voorbereiden')
  : (KIND[t.kind]?.[0] || t.kind);
const meetingName = (l) => l.status === 'closing' ? 'Closing' : 'Intake';

let S = { leads: [], today: [], dash: null, sources: [], sends: [], settings: {}, firstDue: {}, loadedAt: null };

// ───────────── Formatting (Dutch, Amsterdam time) ─────────────
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// Gmail snippets arrive HTML-escaped ("&lt;info@…&gt;"): back to plain text before esc().
const unent = (s) => { const t = document.createElement('textarea'); t.innerHTML = String(s ?? ''); return t.value; };
const D = (v) => (v ? new Date(v) : null);
const dayKey = (d) => new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(d);
const fTime = new Intl.DateTimeFormat('nl-NL', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
const fDay = new Intl.DateTimeFormat('nl-NL', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short' });
const fFull = new Intl.DateTimeFormat('nl-NL', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
const fWd = new Intl.DateTimeFormat('nl-NL', { timeZone: 'UTC', weekday: 'short' });
const rtf = new Intl.RelativeTimeFormat('nl', { numeric: 'auto' });
const time = (d) => fTime.format(d);
const day = (d) => fDay.format(d).replace(/\./g, '');
function due(v) {
  const d = D(v); if (!d) return '–';
  const k = dayKey(d), now = Date.now();
  if (k === dayKey(new Date(now))) return `vandaag ${time(d)}`;
  if (k === dayKey(new Date(now + 864e5))) return `morgen ${time(d)}`;
  if (k === dayKey(new Date(now - 864e5))) return `gisteren ${time(d)}`;
  return `${day(d)} ${time(d)}`;
}
function rel(v) {
  const d = D(v); if (!d) return '–';
  const s = (d.getTime() - Date.now()) / 1000;
  if (Math.abs(s) < 60) return 'zojuist';
  if (Math.abs(s) < 3600) return rtf.format(Math.round(s / 60), 'minute');
  return due(d);
}
const pct = (a, b) => (b ? `${Math.round((a / b) * 100)}%` : '–');
const href = (u) => { const s = String(u || '').trim(); if (!s) return null; const h = /^https?:\/\//i.test(s) ? s : `https://${s}`; try { return new URL(h).href; } catch { return null; } };
const tel = (p) => (p ? `tel:${String(p).replace(/[^+\d]/g, '')}` : null);
// +31 6 1234 5678 for mobiles, +31 45 572 3050 for landlines.
const prettyPhone = (p) => {
  const s = String(p || ''), m = s.match(/^\+31(\d{9})$/);
  if (!m) return s;
  const n = m[1];
  return n[0] === '6' ? `+31 6 ${n.slice(1, 5)} ${n.slice(5)}` : `+31 ${n.slice(0, 2)} ${n.slice(2, 5)} ${n.slice(5)}`;
};
const host = (u) => { try { return new URL(href(u)).hostname.replace(/^www\./, ''); } catch { return u; } };

// ───────────── Data ─────────────
let mockData = null;
async function load() {
  try {
    if (MOCK) {
      mockData = mockData || await (await fetch('mock-snap.json')).json();
      const m = mockData;
      S = {
        leads: m.leads || [], today: m.today || [], dash: (m.dash || [])[0] || null, sources: m.sources || [], sends: m.sends || [],
        settings: Object.fromEntries((m.settings || []).map((r) => [r.key, r.value])),
        firstDue: firstDueMap(m.firstDue || []), loadedAt: new Date(),
      };
    } else {
      const q = await Promise.all([
        sb.from('leads').select('*').order('next_action_at', { ascending: true, nullsFirst: false }),
        sb.from('v_today').select('*'),
        sb.from('v_dashboard').select('*'),
        sb.from('v_reaction_sources').select('*'),
        sb.from('v_sends_7d').select('*').order('day'),
        sb.from('settings').select('key,value'),
        sb.from('tasks').select('lead_id,due_at').eq('kind', 'send_first').eq('state', 'open'),
      ]);
      const bad = q.find((r) => r.error);
      if (bad) throw bad.error;
      const [leads, today, dash, sources, sends, settings, firstDue] = q.map((r) => r.data || []);
      if (!settings.length) { showNoAccess(); return; }
      S = {
        leads, today, dash: dash[0] || null, sources, sends,
        settings: Object.fromEntries(settings.map((r) => [r.key, r.value])),
        firstDue: firstDueMap(firstDue), loadedAt: new Date(),
      };
      ownerPing();
    }
    render();
  } catch (e) {
    console.error(e);
    toast('Laden lukte niet. Probeer het zo nog eens.');
  }
}
function firstDueMap(rows) {
  const m = {};
  for (const r of rows) if (!m[r.lead_id] || r.due_at < m[r.lead_id]) m[r.lead_id] = r.due_at;
  return m;
}

// Same as the app: this network is Jiang's own, so his visits to lead pages from this PC never count. Max every 10 min.
let lastPing = 0;
function ownerPing() {
  if (Date.now() - lastPing < 10 * 60e3) return;
  lastPing = Date.now();
  sb.functions.invoke('task-action', { body: { action: 'owner_ping' } }).catch(() => {});
}

async function leadDetail(id) {
  if (MOCK) {
    return {
      events: (mockData.events || []).filter((e) => e.lead_id === id),
      tasks: (mockData.today || []).filter((t) => t.lead_id === id),

  const [ev, tk] = await Promise.all([
    sb.from('lead_events').select('*').eq('lead_id', id).order('at', { ascending: false }).limit(150),
    sb.from('tasks').select('*').eq('lead_id', id).in('state', ['open', 'snoozed']).order('due_at'),
  ]);
  return { events: ev.data || [], tasks: tk.data || [] };
}

// Notes per lead (table lead_notes), newest first. Added and deleted through task-action, like the app.
async function loadNotes(id) {
  if (MOCK) return (mockData.notes || []).filter((n) => n.lead_id === id).sort((a, b) => b.created_at.localeCompare(a.created_at));
  const r = await sb.from('lead_notes').select('*').eq('lead_id', id).order('created_at', { ascending: false });
  return r.data || [];
}

async function act(action, body) {
  if (MOCK) {
    const notes = (mockData.notes = mockData.notes || []);
    if (action === 'add_note') notes.push({ id: Date.now(), lead_id: body.lead_id, text: body.note, source: 'web', created_at: new Date().toISOString(), remind_at: body.remind_at || null });
    if (action === 'set_note_reminder') { const n = notes.find((x) => x.id === body.note_id); if (n) Object.assign(n, { remind_at: body.remind_at, reminded_at: null }); }
    if (action === 'delete_note') mockData.notes = notes.filter((n) => n.id !== body.note_id);
    return true;
  }
  const { data, error } = await sb.functions.invoke('task-action', { body: { action, ...body } });
  if (error || data?.error) {
    const code = data?.error || await error?.context?.json?.().then((j) => j.error).catch(() => null);
    toast({ bad_remind_at: 'Kies een moment in de toekomst', note_not_found: 'Die notitie bestaat niet meer' }[code] || 'Opslaan lukte niet. Probeer het zo nog eens.');
    return false;
  }
  return true;
}

function engineProblem() {
  const s = S.settings.engine_status;

  if (s.gmail_ok === false) return ['Gmail-koppeling werkt niet', 'Er gaan geen mails of follow-ups klaar. Vraag Claude om Gmail opnieuw te koppelen.'];
  if (s.last_tick && Date.now() - new Date(s.last_tick) > 30 * 60e3) return ['Lead engine draait niet', `Laatste ronde ${rel(s.last_tick)}. Vraag Claude om te kijken.`];

function filteredLeads() {
  let list = S.leads.slice();
  const q = UI.q.trim().toLowerCase();
  if (q) list = list.filter((l) => [l.company, l.contact_name, l.email, l.city, l.phone, l.niche].some((v) => v && String(v).toLowerCase().includes(q)));
  const far = 8.64e15;
  const t = (v) => (v ? new Date(v).getTime() : null);
  if (UI.sort === 'next') list.sort((a, b) => (stageOf(a.status) - stageOf(b.status)) || ((t(nextDate(a)) ?? far) - (t(nextDate(b)) ?? far)));
  if (UI.sort === 'seen') list.sort((a, b) => (t(b.last_seen_at) ?? -far) - (t(a.last_seen_at) ?? -far));
  if (UI.sort === 'new') list.sort((a, b) => (t(b.created_at) ?? 0) - (t(a.created_at) ?? 0));
  if (UI.sort === 'name') list.sort((a, b) => a.company.localeCompare(b.company, 'nl'));
  return list;
}

const PAGE_SIGNALS = new Set(['page_view', 'video_play', 'video_50', 'video_end', 'plan_open']);
function describe(e) {
  const d = e.data || {};
  switch (e.type) {
    case 'created': return ['Lead aangemaakt', 'doc', 'grey'];
    case 'draft_ready': return ['Concept klaar in Gmail', 'doc', 'grey'];
    case 'sent': return [`Eerste mail verstuurd${d.from ? ` vanaf ${d.from}` : ''}`, 'send', 'blue'];
    case 'followup_ready': return [Number(d.round) === 2 ? 'Follow-up 2 klaargezet' : 'Follow-up klaargezet', 'fwd', 'grey'];
    case 'followup_sent': return [Number(d.round) === 2 ? 'Follow-up 2 verstuurd' : 'Follow-up verstuurd', 'fwd', 'blue'];
    case 'dm_ready': return ['DM klaargezet', 'reply', 'grey'];
    case 'dm_done': return ['DM verstuurd', 'reply', 'blue'];
    case 'call_due': return ['Bellen ingepland', 'phone', 'grey'];
    case 'call_logged': return [`Gebeld: ${String(d.outcome || '').replace(/_/g, ' ')}`, 'phone', 'blue'];
    case 'reply': return [`Reactie: ${d.summary || ''}`, 'reply', 'orange'];
    case 'booking': return [`Intake ingepland${d.meeting_at ? `: ${fFull.format(new Date(d.meeting_at))}` : ''}`, 'cal', 'green'];
    case 'closing_planned': return [`Closing ingepland${d.meeting_at ? `: ${fFull.format(new Date(d.meeting_at))}` : ''}`, 'cal', 'green'];
    case 'bounce': return ['Mail kwam niet aan', 'alert', 'red'];
    case 'mail_open': {
      const via = { gmail: ' (Gmail)', outlook: ' (Outlook)', apple_mail: ' (Apple Mail)', yahoo: ' (Yahoo)' }[d.client] || '';
      return [`${Number(d.step || 1) >= 2 ? 'Follow-up of mail' : 'Mail'} geopend${via}`, 'open', 'blue'];
    }
    case 'status_change': return [`Status → ${STATUS[d.to]?.[0] || d.to || ''}`, 'status', 'grey'];
    case 'note':
      return ({
        auto_reply: ['Automatisch antwoord', 'mail', 'grey'], dm_skipped: ['DM overgeslagen: geen social gevonden', 'reply', 'grey'],
        task_snoozed: ['Taak gesnoozed', 'clock', 'grey'], task_skipped: ['Taak overgeslagen', 'fwd', 'grey'],
        note: [`Notitie: ${d.text || ''}`, 'note', 'grey'],
      })[d.kind] || ['Notitie', 'note', 'grey'];
    default: return [e.type, 'check', 'grey'];
  }
}
// Page signals of one visit become one line (newest first), like the app.
function activity(events) {
  const shown = events.filter((e) => !(e.type === 'mail_open' && e.data?.auto != null) && e.type !== 'app_action');
  const out = [];
  for (let i = 0; i < shown.length;) {
    const e = shown[i];
    if (PAGE_SIGNALS.has(e.type)) {
      const visit = [e];
      let j = i + 1;
      while (j < shown.length && PAGE_SIGNALS.has(shown[j].type) && visit[visit.length - 1].data?.visit == null &&
             new Date(visit[visit.length - 1].at) - new Date(shown[j].at) < 30 * 60e3) { visit.push(shown[j]); j++; }
      const types = new Set(visit.map((v) => v.type));
      const parts = [types.has('video_end') ? 'Video helemaal bekeken' : types.has('video_50') ? 'Video half bekeken' : types.has('video_play') ? 'Video gestart' : 'Pagina bekeken, video niet gestart'];
      if (types.has('plan_open')) parts.push('planner geopend');
      out.push({ at: visit[visit.length - 1].at, text: parts.join(' · '), ic: 'play', c: types.has('video_play') || types.has('plan_open') ? 'green' : 'grey' });
      i = j; continue;
    }
    const [text, ic, c] = describe(e);
    out.push({ at: e.at, text, ic, c });
    i++;
  }
  return out;
}

const tomorrowNine = () => { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); return d; };

function reminderChip(n) {
  if (!n.remind_at) return '';
  const done = n.reminded_at || new Date(n.remind_at) <= new Date();
  return `<div class="remind-chip"><span class="chip ${done ? 'st-grey' : 'st-orange'}">${icon('bell')} ${done ? 'Herinnerd' : 'Herinnering'} ${due(n.remind_at)}</span></div>`;
}

function notesCard(notes) {
  const list = notes.map((n) => `<div class="note" data-note="${n.id}">
      <div class="note-meta">${icon(n.source === 'call' ? 'phone' : 'note')}<span>${due(n.created_at)}${NOTE_SOURCE[n.source] || ''}</span>
        <button class="note-bell" data-note-remind="${n.id}" title="Herinnering instellen" aria-label="Herinnering instellen">${icon('bell')}</button>
        <button class="note-del" data-note-del="${n.id}" title="Verwijder notitie" aria-label="Verwijder notitie">${icon('x')}</button></div>
      <div class="note-text">${esc(n.text)}</div>${reminderChip(n)}</div>`).join('');
  return `<h2>Notities</h2>
    <form class="note-form" id="note-form">
      <textarea id="note-text" rows="2" placeholder="Nieuwe notitie… (⌘↩ om op te slaan)"></textarea>
      <div class="note-row">
        <label class="remind" title="Je krijgt een melding op je iPhone">${icon('bell')}<input type="datetime-local" id="note-remind" min="${localInput(new Date())}" aria-label="Herinnering (optioneel)"></label>
        <button type="button" class="qp" data-qp="hour">Over 1 uur</button>
        <button type="button" class="qp" data-qp="tomorrow">Morgen 9:00</button>
        <button class="btn primary" type="submit" id="note-add">Toevoegen</button>
      </div>
    </form>
    ${list || '<p class="muted small">Nog geen notities.</p>'}`;
}

function openReminderEdit(id) {
  const note = document.querySelector(`.note[data-note="${id}"]`);
  if (!note || note.querySelector('.remind-edit')) return;
  const chip = note.querySelector('.remind-chip');
  const has = !!chip;
  const box = document.createElement('div');
  box.className = 'remind-edit';
  box.innerHTML = `<input type="datetime-local" min="${localInput(new Date())}" value="${localInput(tomorrowNine())}" aria-label="Herinnering">
    <button class="btn primary" data-remind-save="${id}">Opslaan</button>
    ${has ? `<button class="btn" data-remind-clear="${id}">Weghalen</button>` : ''}
    <button class="btn" data-remind-cancel>Annuleer</button>`;
  note.appendChild(box);
  box.querySelector('input').focus();
}

async function refreshNotes() {
  const id = UI.openLead, card = $('#notes-card');
  if (!id || !card) return;
  const notes = await loadNotes(id);
  if (UI.openLead === id) card.innerHTML = notesCard(notes);
  if (prepState.leadId === id && $('#prep').classList.contains('open')) $('#prep-notes').innerHTML = prepNotes(notes);
}

function drawerBody(l, events, tasks, notes) {
  const nd = nextDate(l);
  const opens = l.mail_opens || 0;
  const web = href(l.website);
  const ig = l.instagram ? `https://instagram.com/${encodeURIComponent(String(l.instagram).replace(/^@/, '').trim())}` : null;
  const fb = l.facebook ? href(/^https?:|facebook\.com/i.test(l.facebook) ? l.facebook : `facebook.com/${l.facebook}`) : null;
  const page = `https://socialwave-agency.nl/v/${encodeURIComponent(l.slug)}?me=1`;
  const video = `https://socialwave-agency.nl/v/media/${encodeURIComponent(l.slug)}-video.mp4`;
  const thread = l.gmail_thread_id ? `https://mail.google.com/mail/u/0/#all/${encodeURIComponent(l.gmail_thread_id)}` : null;

  const signals = [
    opens ? [`Mail geopend${opens > 1 ? ` ${opens}x` : ''} · eerst ${rel(l.mail_opened_at)}`, 'open', 'blue']
          : ['Mail nog niet geopend (of beeld uit)', 'mail', 'grey'],
    l.video_plays ? [`Video ${l.video_plays}x bekeken${l.video_completed ? ' · helemaal' : ''}${l.last_seen_at ? ` · laatst ${rel(l.last_seen_at)}` : ''}`, 'play', 'green']
      : l.video_views ? [`Pagina ${l.video_views}x bezocht, video nog niet gestart`, 'eye', 'grey'] : ['Video nog niet bekeken', 'play', 'grey'],
  ];
  const facts = [
    nd && !l.meeting_at ? ['Volgende stap', due(nd), 'clock'] : null,
    l.meeting_at && hasMeeting(l) ? [meetingName(l), fFull.format(new Date(l.meeting_at)), 'cal'] : null,
    l.first_sent_at ? ['Eerste mail', due(l.first_sent_at), 'send'] : null,
    l.sender_email ? ['Mailbox', l.sender_email, 'mail'] : null,
    l.call_attempts ? ['Belpogingen', `${l.call_attempts}${l.call_outcome ? ` · ${String(l.call_outcome).replace(/_/g, ' ')}` : ''}`, 'phone'] : null,
  ].filter(Boolean);
  const contact = [
    l.email ? ['mail', `<a href="mailto:${esc(l.email)}">${esc(l.email)}</a>`] : null,
    l.phone ? ['phone', `<a href="${tel(l.phone)}">${esc(prettyPhone(l.phone))}</a> <button class="btn icon" style="padding:3px" data-copy="${esc(l.phone)}" data-what="Nummer" title="Kopieer">${icon('copy')}</button>`] : null,
    web ? ['globe', `<a href="${esc(web)}" target="_blank" rel="noopener">${esc(host(l.website))}</a>`] : null,
    ig ? ['insta', `<a href="${esc(ig)}" target="_blank" rel="noopener">@${esc(String(l.instagram).replace(/^@/, ''))}</a>`] : null,
    fb ? ['fb', `<a href="${esc(fb)}" target="_blank" rel="noopener">Facebook</a>`] : null,
  ].filter(Boolean);
  const act = activity(events);

  return `
    <div class="quick">
      <a class="btn primary" href="${esc(page)}" target="_blank" rel="noopener">${icon('ext')} Leadpagina</a>
      <a class="btn" href="${esc(video)}" target="_blank" rel="noopener">${icon('film')} Video</a>
      ${thread ? `<a class="btn" href="${esc(thread)}" target="_blank" rel="noopener">${icon('mail')} Gmail-thread</a>` : ''}
      ${l.phone ? `<a class="btn" href="${tel(l.phone)}">${icon('phone')} Bel</a>` : ''}
    </div>
    ${l.reply_snippet ? `<div class="card"><h2>Reactie${l.reply_class ? ` · ${esc(l.reply_class)}` : ''}</h2><div class="reply">${esc(unent(l.reply_snippet))}</div></div>` : ''}
    ${stepCard(l)}
    ${hasMeeting(l) ? `<div class="card" id="prep-card">${prepCard(l)}</div>` : ''}
    <div class="card" id="intake-card">${intakeCard()}</div>
    <div class="card" id="notes-card">${notesCard(notes)}</div>
    <div class="card"><h2>Signalen</h2><div class="rows">${signals.map(([t, ic, c]) => `<div class="ev c-${c}" style="grid-template-columns:22px 1fr;padding:4px 0">${icon(ic)}<span>${esc(t)}</span></div>`).join('')}</div></div>
    ${facts.length ? `<div class="card"><h2>Sequence</h2><div class="rows">${facts.map(([k, v, ic]) => `<div>${icon(ic, 'faint')}<span class="k">${k}</span><span>${esc(v)}</span></div>`).join('')}</div></div>` : ''}
    ${tasks.length ? `<div class="card"><h2>Open taken</h2><div class="rows">${tasks.map((t) => `<div>${icon(KIND[t.kind]?.[1] || 'check', 'faint')}<span class="k">${esc(taskLabel(t))}</span><span>${due(t.due_at)}${t.state === 'snoozed' ? ' · gesnoozed' : ''}</span></div>`).join('')}</div></div>` : ''}
    ${contact.length ? `<div class="card"><h2>Contact</h2><div class="rows">${contact.map(([ic, h]) => `<div>${icon(ic, 'faint')}<span>${h}</span></div>`).join('')}</div></div>` : ''}
    <div class="card"><h2>Activiteit</h2><div class="timeline">${act.length ? act.map((a) => `<div class="ev c-${a.c}">${icon(a.ic)}<span>${esc(a.text)}</span><span class="t">${rel(a.at)}</span></div>`).join('') : '<p class="muted">Nog geen activiteit.</p>'}</div></div>`;
}

// ───────────── Intake → closing → klant (same buttons as the app) ─────────────
function stepCard(l) {
  const intake = l.status === 'intake' || l.status === 'afspraak';
  if (!intake && l.status !== 'closing') return '';
  const when = `<div class="note-row" style="margin-top:4px"><label class="remind">${icon('cal')}<input type="datetime-local" id="step-when" min="${localInput(new Date())}" aria-label="Datum en tijd"></label>`;
  return `<div class="card" id="step-card"><h2>Volgende stap <span class="sub">intake → closing → klant</span></h2>${intake
    ? `<p class="small muted">Intake gedaan? Plan de closing.</p>${when}
        <button class="btn primary" data-step="plan_closing">${icon('star')} Closing inplannen</button>
        <button class="btn" data-step="set_meeting">Intake verzetten</button></div>
       <div class="note-row" style="margin-top:10px"><button class="btn" data-step-status="geen_interesse">${icon('hand')} Geen interesse na intake</button></div>`
    : `<div class="note-row"><button class="btn primary" data-step-status="klant">${icon('star')} Klant geworden</button>
        <button class="btn" data-step-status="afgerond">${icon('x')} Geen klant geworden</button></div>
       <p class="small muted" style="margin-top:12px">Closing verzetten:</p>${when}
        <button class="btn" data-step="plan_closing">Verzetten</button></div>`}</div>`;
}

document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-step], [data-step-status]');
  if (!b || !UI.openLead) return;
  const l = S.leads.find((x) => x.id === UI.openLead);
  if (!l) return;
  let ok;
  if (b.dataset.step) {
    const v = $('#step-when')?.value;
    if (!v) { toast('Kies eerst de datum en tijd'); $('#step-when')?.focus(); return; }
    b.disabled = true;
    ok = await act(b.dataset.step, { lead_id: l.id, meeting_at: new Date(v).toISOString() });
    if (ok) toast(b.dataset.step === 'plan_closing' ? 'Closing ingepland' : 'Intake verzet');
  } else {
    const s = b.dataset.stepStatus;
    if (!confirm(`${l.company} op ${STATUS[s][0]}?${s === 'geen_interesse' ? ' Deze lead wordt nooit meer gecontacteerd.' : ''}`)) return;
    b.disabled = true;
    ok = await act('set_status', { lead_id: l.id, status: s });
  }
  b.disabled = false;
  if (ok) { await load(); if (UI.openLead === l.id) openLead(l.id, false); }
});

function closeLead() {
  UI.openLead = null;
  $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open');
  if (location.hash.startsWith('#lead/')) history.replaceState(null, '', `#${UI.tab}`);
}

// ───────────── Script (settings.scripts) ─────────────
// Jiang's call scripts, editable here and in the app. { intake: { title, sections: [{ id, title, hint }] } }
const DEFAULT_SCRIPTS = { intake: { title: 'Intake', sections: [] } };
const scripts = () => S.settings.scripts || DEFAULT_SCRIPTS;
const intakeSections = () => scripts().intake?.sections || [];
const hintLines = (h) => String(h || '').split('\n').map((x) => x.trim()).filter(Boolean);
const newId = () => 's' + Math.random().toString(36).slice(2, 8);
let scriptDraft = null; // sections being edited, or null when just reading

function renderScript() {
  const view = $('#v-script');
  const secs = scriptDraft || intakeSections();
  const head = `<div class="hello"><h1>Script</h1><p>Je leidraad voor gesprekken. Wat je hier aanpast staat meteen ook in de app.</p></div>`;
  if (!scriptDraft) {
    view.innerHTML = `${head}
      <div class="card"><div class="script-head"><h2 style="margin:0">Intake</h2><span class="faint small">${secs.length} onderdelen</span><div class="spacer"></div><button class="btn" data-script-edit>${icon('note')} Bewerken</button></div>
      ${secs.length ? secs.map((x, i) => `<div class="sec"><div class="nr">${i + 1}</div><div><h3>${esc(x.title)}</h3>${hintLines(x.hint).length ? `<ul>${hintLines(x.hint).map((h) => `<li>${esc(h)}</li>`).join('')}</ul>` : ''}</div></div>`).join('')
        : '<p class="muted">Nog leeg. Klik op Bewerken om onderdelen toe te voegen.</p>'}</div>`;
    return;
  }
  view.innerHTML = `${head}
    <div class="card"><div class="script-head"><h2 style="margin:0">Intake bewerken</h2><div class="spacer"></div>
      <button class="btn" data-script-cancel>Annuleer</button><button class="btn primary" data-script-save>Opslaan</button></div>
    ${secs.map((x, i) => `<div class="sec-edit" data-i="${i}">
        <input value="${esc(x.title)}" data-f="title" placeholder="Onderdeel, bijv. Wie zijn ze">
        <div class="tools">
          <button class="btn icon" data-script-up="${i}" title="Omhoog" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="btn icon" data-script-down="${i}" title="Omlaag" ${i === secs.length - 1 ? 'disabled' : ''}>↓</button>
          <button class="btn icon" data-script-del="${i}" title="Verwijder">${icon('x')}</button>
        </div>
        <textarea rows="3" data-f="hint" placeholder="Vragen, één per regel">${esc(x.hint)}</textarea>
      </div>`).join('')}
    <button class="btn" data-script-add style="margin-top:12px">+ Onderdeel toevoegen</button></div>`;
}

// Copies what's typed into the draft before a re-render (move, add, delete).
function syncScriptDraft() {
  for (const row of document.querySelectorAll('.sec-edit')) {
    const x = scriptDraft[Number(row.dataset.i)];
    x.title = row.querySelector('[data-f=title]').value;
    x.hint = row.querySelector('[data-f=hint]').value;
  }
}

async function saveScript() {
  syncScriptDraft();
  const sections = scriptDraft.map((x) => ({ id: x.id, title: x.title.trim(), hint: x.hint.trim() })).filter((x) => x.title || x.hint)
    .map((x) => ({ ...x, title: x.title || 'Zonder titel' }));
  const value = { ...scripts(), intake: { ...(scripts().intake || {}), title: 'Intake', sections } };
  if (!MOCK) {
    const { error } = await sb.from('settings').update({ value }).eq('key', 'scripts');
    if (error) { toast('Opslaan lukte niet. Probeer het zo nog eens.'); return; }
  }
  S.settings.scripts = value;
  scriptDraft = null;
  renderScript();
  toast('Script opgeslagen');
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-script-edit],[data-script-cancel],[data-script-save],[data-script-add],[data-script-up],[data-script-down],[data-script-del]');
  if (!t) return;
  const d = t.dataset;
  if (d.scriptEdit != null) { scriptDraft = structuredClone(intakeSections()); renderScript(); return; }
  if (d.scriptCancel != null) { scriptDraft = null; renderScript(); return; }
  if (d.scriptSave != null) { saveScript(); return; }
  syncScriptDraft();
  if (d.scriptAdd != null) scriptDraft.push({ id: newId(), title: '', hint: '' });
  const swap = (a, b) => { [scriptDraft[a], scriptDraft[b]] = [scriptDraft[b], scriptDraft[a]]; };
  if (d.scriptUp) swap(Number(d.scriptUp), Number(d.scriptUp) - 1);
  if (d.scriptDown) swap(Number(d.scriptDown), Number(d.scriptDown) + 1);
  if (d.scriptDel) scriptDraft.splice(Number(d.scriptDel), 1);
  renderScript();
  if (d.scriptAdd != null) [...document.querySelectorAll('.sec-edit input')].pop()?.focus();
});

// ───────────── Intake per lead (lead_intakes) ─────────────
// answers: { <section id>: { title, text } }; the title is kept so an answer survives a renamed or removed question.
let intakeState = { leadId: null, row: null };
let intakeTimer = null;

async function loadIntake(id) {
  if (MOCK) return (mockData.intakes || {})[id] || null;
  const r = await sb.from('lead_intakes').select('*').eq('lead_id', id).maybeSingle();
  return r.data || null;
}

function intakeProgress(row) {
  const secs = intakeSections();
  const filled = secs.filter((x) => row?.answers?.[x.id]?.text?.trim()).length;
  return { filled, total: secs.length, story: !!row?.story?.trim() };
}

function intakeCard() {
  const row = intakeState.row, p = intakeProgress(row);
  const sub = row ? `${p.filled} van ${p.total} ingevuld${p.story ? ' · verhaal' : ''} · bewerkt ${rel(row.updated_at)}` : 'Nog niet ingevuld';
  return `<h2>Intake</h2><div class="intake-sum">
    <div class="meter"><span style="width:${p.total ? (p.filled / p.total) * 100 : 0}%"></span></div>
    <span class="small muted">${sub}</span>
    <button class="btn primary" data-intake-open>${icon('doc')} ${row ? 'Open intake' : 'Start intake'}</button></div>`;
}

function openIntake() {
  const l = S.leads.find((x) => x.id === intakeState.leadId);
  if (!l) return;
  const row = intakeState.row || { answers: {}, story: '' };
  const secs = intakeSections();
  const known = new Set(secs.map((x) => x.id));
  const old = Object.entries(row.answers || {}).filter(([id, a]) => !known.has(id) && a?.text?.trim());
  const q = (id, title, hint, text, i) => `<div class="q" data-q="${esc(id)}" data-title="${esc(title)}">
      <h3><span class="nr">${i}</span>${esc(title)}</h3>${hint ? `<div class="hint">${esc(hint)}</div>` : ''}
      <textarea data-answer placeholder="Wat vertellen ze…">${esc(text || '')}</textarea></div>`;
  $('#intake').innerHTML = `
    <div class="intake-top"><button class="btn icon" data-intake-close aria-label="Sluiten">${icon('x')}</button>
      <h2>Intake · ${esc(l.company)}</h2><span class="saved" id="intake-saved">${intakeState.row ? `Opgeslagen ${rel(intakeState.row.updated_at)}` : ''}</span></div>
    <div class="intake">
      ${secs.map((x, i) => q(x.id, x.title, x.hint, row.answers?.[x.id]?.text, i + 1)).join('')}
      ${old.length ? `<p class="faint small" style="margin:6px 0 10px">Uit een eerdere versie van het script</p>${old.map(([id, a]) => q(id, a.title || 'Vraag', '', a.text, '·').replace('class="q"', 'class="q old"')).join('')}` : ''}
      <div class="q story"><h3><span class="nr">${icon('note')}</span>Hun verhaal &amp; overige notities</h3>
        <div class="hint">Alles wat ze hebben meegemaakt en wat verder opviel.</div>
        <textarea data-story placeholder="Hun verhaal…">${esc(row.story || '')}</textarea></div>
      <p class="faint small">Wordt vanzelf opgeslagen. De vragen pas je aan onder Script.</p>
    </div>`;
  $('#intake').classList.add('open');
  document.body.style.overflow = 'hidden';
  for (const ta of document.querySelectorAll('#intake textarea')) grow(ta);
  $('#intake textarea')?.focus();
}

function grow(ta) { ta.style.height = 'auto'; ta.style.height = `${ta.scrollHeight + 2}px`; }

async function saveIntake() {
  clearTimeout(intakeTimer); intakeTimer = null;
  const id = intakeState.leadId;
  if (!id || !$('#intake').classList.contains('open')) return;
  const answers = { ...(intakeState.row?.answers || {}) };
  for (const qd of document.querySelectorAll('#intake .q[data-q]')) {
    answers[qd.dataset.q] = { title: qd.dataset.title, text: qd.querySelector('textarea').value };
  }
  const row = { lead_id: id, answers, story: $('#intake [data-story]').value, updated_at: new Date().toISOString() };
  $('#intake-saved').textContent = 'Opslaan…';
  if (!MOCK) {
    const { error } = await sb.from('lead_intakes').upsert(row);
    if (error) { $('#intake-saved').textContent = 'Opslaan lukte niet'; toast('Intake opslaan lukte niet. Probeer het zo nog eens.'); return; }
  } else {
    (mockData.intakes = mockData.intakes || {})[id] = row;
  }
  intakeState.row = row;
  if (intakeState.leadId === id) $('#intake-saved').textContent = `Opgeslagen ${time(new Date())}`;
}

async function closeIntake() {
  if (intakeTimer) await saveIntake();
  $('#intake').classList.remove('open');
  if (!$('#prep').classList.contains('open')) document.body.style.overflow = '';
  const card = $('#intake-card');
  if (card) card.innerHTML = intakeCard();
}

document.addEventListener('input', (e) => {
  if (!e.target.closest('#intake') || e.target.tagName !== 'TEXTAREA') return;
  grow(e.target);
  $('#intake-saved').textContent = 'Wijzigingen…';
  clearTimeout(intakeTimer);
  intakeTimer = setTimeout(saveIntake, 900);
});
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-intake-open]')) openIntake();
  if (e.target.closest('[data-intake-close]')) closeIntake();
});
window.addEventListener('beforeunload', (e) => { if (intakeTimer) { saveIntake(); e.preventDefault(); } });

// ───────────── Voorbereiding per lead with an appointment (lead_preps) ─────────────
// Same idea as the intake: fixed questions with big fields, saved by themselves, plus the lead's dated notes in large.
const PREP_SECTIONS = [
  { id: 'doel', title: 'Doel van het gesprek', hint: 'Wat wil ik dat er na dit gesprek besloten is?' },
  { id: 'weet', title: 'Wat ik al weet', hint: 'Website, Instagram, Facebook, reviews. Wat valt op, wat gaat goed, wat mist?' },
  { id: 'laten', title: 'Wat ik laat zien', hint: 'Voorbeeldwebsite, video, voorstel, prijzen.' },
  { id: 'vragen', title: 'Vragen die ik wil stellen', hint: '' },
];
const hasMeeting = (l) => ['intake', 'closing', 'afspraak'].includes(l.status);
let prepState = { leadId: null, row: null };
let prepTimer = null;

async function loadPrep(id) {
  if (MOCK) return (mockData.preps || {})[id] || null;
  const r = await sb.from('lead_preps').select('*').eq('lead_id', id).maybeSingle();
  return r.data || null;
}

function prepCard(l) {
  const row = prepState.row;
  const filled = PREP_SECTIONS.filter((x) => row?.answers?.[x.id]?.text?.trim()).length;
  const sub = row ? `${filled} van ${PREP_SECTIONS.length} ingevuld${row.body?.trim() ? ' · notities' : ''} · bewerkt ${rel(row.updated_at)}` : 'Nog niet voorbereid';
  return `<h2>Voorbereiding</h2><div class="intake-sum">
    ${l.meeting_at ? `<div class="when">${icon('cal', 'faint')} ${meetingName(l)} ${esc(fFull.format(new Date(l.meeting_at)))}</div>` : ''}
    <div class="meter"><span style="width:${(filled / PREP_SECTIONS.length) * 100}%"></span></div>
    <span class="small muted">${sub}</span>
    <button class="btn primary" data-prep-open>${icon('doc')} ${row ? 'Open voorbereiding' : 'Start voorbereiding'}</button></div>`;
}

function prepNotes(notes) {
  return notes.length ? notes.map((n) => `<div class="note">
      <div class="note-meta">${icon(n.source === 'call' ? 'phone' : 'note')}<span>${due(n.created_at)}${NOTE_SOURCE[n.source] || ''}</span></div>
      <div class="note-text">${esc(n.text)}</div></div>`).join('') : '<p class="muted small">Nog geen notities.</p>';
}

async function openPrep(push = true) {
  const l = S.leads.find((x) => x.id === prepState.leadId);
  if (!l) return;
  if (push) history.replaceState(null, '', `#prep/${l.slug}`);
  const row = prepState.row || { answers: {}, body: '' };
  const web = href(l.website);
  const ig = l.instagram ? `https://instagram.com/${encodeURIComponent(String(l.instagram).replace(/^@/, '').trim())}` : null;
  const fb = l.facebook ? href(/^https?:|facebook\.com/i.test(l.facebook) ? l.facebook : `facebook.com/${l.facebook}`) : null;
  const links = [
    [`https://socialwave-agency.nl/v/${encodeURIComponent(l.slug)}?me=1`, 'ext', 'Leadpagina'],
    web && [web, 'globe', 'Website'], ig && [ig, 'insta', 'Instagram'], fb && [fb, 'fb', 'Facebook'],
  ].filter(Boolean);
  $('#prep').innerHTML = `
    <div class="intake-top"><button class="btn icon" data-prep-close aria-label="Sluiten">${icon('x')}</button>
      <h2>Voorbereiding · ${esc(l.company)}</h2><span class="saved" id="prep-saved">${prepState.row ? `Opgeslagen ${rel(prepState.row.updated_at)}` : ''}</span></div>
    <div class="prep">
      <div class="intake">
        ${PREP_SECTIONS.map((x, i) => `<div class="q" data-q="${x.id}" data-title="${esc(x.title)}">
          <h3><span class="nr">${i + 1}</span>${esc(x.title)}</h3>${x.hint ? `<div class="hint">${esc(x.hint)}</div>` : ''}
          <textarea data-answer>${esc(row.answers?.[x.id]?.text || '')}</textarea></div>`).join('')}
        <div class="q story"><h3><span class="nr">${icon('note')}</span>Vrije notities</h3>
          <div class="hint">Alles wat je verder kwijt wilt voor dit gesprek.</div>
          <textarea data-body placeholder="Typ hier…">${esc(row.body || '')}</textarea></div>
        <p class="faint small">Wordt vanzelf opgeslagen.</p>
      </div>
      <div class="prep-side">
        <div class="card">
          ${l.meeting_at ? `<div class="prep-when">${icon('cal')} ${esc(fFull.format(new Date(l.meeting_at)))}</div>` : `<div class="prep-when">${meetingName(l)}</div>`}
          <div class="muted small" style="margin-top:4px">${esc([l.contact_name, l.city, l.niche].filter(Boolean).join(' · '))}</div>
          <div class="prep-links">${links.map(([u, ic, t]) => `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">${icon(ic)} ${t}</a>`).join('')}
            ${l.phone ? `<a class="btn" href="${tel(l.phone)}">${icon('phone')} Bel</a>` : ''}</div>
          <div class="prep-links"><button class="btn" data-intake-open>${icon('doc')} ${intakeState.row ? 'Open intake' : 'Start intake'}</button></div>
        </div>
        <div class="card"><h2>Notities</h2>
          <form class="note-form" id="prep-note-form">
            <textarea id="prep-note-text" placeholder="Nieuwe notitie… (⌘↩ om op te slaan)"></textarea>
            <div class="note-row"><button class="btn primary" type="submit" id="prep-note-add">Toevoegen</button></div>
          </form>
          <div class="notes-list" id="prep-notes"><div class="skel"></div></div>
        </div>
      </div>
    </div>`;
  $('#prep').classList.add('open');
  document.body.style.overflow = 'hidden';
  for (const ta of document.querySelectorAll('#prep .intake textarea')) grow(ta);
  $('#prep .intake textarea')?.focus();
  const notes = await loadNotes(l.id);
  if (prepState.leadId === l.id && $('#prep-notes')) $('#prep-notes').innerHTML = prepNotes(notes);
}

async function savePrep() {
  clearTimeout(prepTimer); prepTimer = null;
  const id = prepState.leadId;
  if (!id || !$('#prep').classList.contains('open')) return;
  const answers = { ...(prepState.row?.answers || {}) };
  for (const qd of document.querySelectorAll('#prep .q[data-q]')) {
    answers[qd.dataset.q] = { title: qd.dataset.title, text: qd.querySelector('textarea').value };
  }
  const row = { lead_id: id, answers, body: $('#prep [data-body]').value, updated_at: new Date().toISOString() };
  $('#prep-saved').textContent = 'Opslaan…';
  if (!MOCK) {
    const { error } = await sb.from('lead_preps').upsert(row);
    if (error) { $('#prep-saved').textContent = 'Opslaan lukte niet'; toast('Voorbereiding opslaan lukte niet. Probeer het zo nog eens.'); return; }
  } else {
    (mockData.preps = mockData.preps || {})[id] = row;
  }
  prepState.row = row;
  if (prepState.leadId === id) $('#prep-saved').textContent = `Opgeslagen ${time(new Date())}`;
}

async function closePrep() {
  if (prepTimer) await savePrep();
  $('#prep').classList.remove('open');
  document.body.style.overflow = '';
  const l = S.leads.find((x) => x.id === prepState.leadId);
  if (l && location.hash.startsWith('#prep/')) history.replaceState(null, '', `#lead/${l.slug}`);
  const card = $('#prep-card');
  if (card && l) card.innerHTML = prepCard(l);
}

document.addEventListener('input', (e) => {
  if (!e.target.closest('#prep .intake') || e.target.tagName !== 'TEXTAREA') return;
  grow(e.target);
  $('#prep-saved').textContent = 'Wijzigingen…';
  clearTimeout(prepTimer);
  prepTimer = setTimeout(savePrep, 900);
});
document.addEventListener('click', (e) => {
  if (e.target.closest('[data-prep-open]')) openPrep();
  if (e.target.closest('[data-prep-close]')) closePrep();
});
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'prep-note-form') return;
  e.preventDefault();
  const box = $('#prep-note-text'), btn = $('#prep-note-add'), text = box.value.trim();
  if (!text || !prepState.leadId) return;
  btn.disabled = true; btn.textContent = 'Opslaan…';
  const ok = await act('add_note', { lead_id: prepState.leadId, note: text, source: 'web', remind_at: null });
  btn.disabled = false; btn.textContent = 'Toevoegen';
  if (ok) { box.value = ''; toast('Notitie opgeslagen'); refreshNotes(); }
});
window.addEventListener('beforeunload', (e) => { if (prepTimer) { savePrep(); e.preventDefault(); } });

// ───────────── Routing + events ─────────────
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (h.includes('access_token') || h.includes('error_description')) return;
  const [tab, arg] = h.split('/');
  if (tab === 'lead') {
    const l = S.leads.find((x) => x.slug === arg);
    if (l) { if ($('#prep').classList.contains('open')) closePrep(); if (UI.openLead !== l.id) openLead(l.id, false); return; }
  }
  if (tab === 'prep') {
    const l = S.leads.find((x) => x.slug === arg);
    if (l) {
      if (UI.openLead === l.id && prepState.leadId === l.id) { if (!$('#prep').classList.contains('open')) openPrep(false); return; }
      openLead(l.id, false).then(() => { if (UI.openLead === l.id) openPrep(false); });
      return;
    }
  }
  if (tab === 'leads') UI.stage = STAGES.some((s) => s.id === arg) ? arg : (arg === undefined ? UI.stage : null);
  UI.tab = TABS.includes(tab) ? tab : (UI.tab || 'overzicht');
  for (const id of TABS) $(`#v-${id}`).hidden = id !== UI.tab;
  if (UI.openLead && tab !== 'lead') { UI.openLead = null; $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); }
  render();
}
window.addEventListener('hashchange', route);

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-lead],[data-copy],[data-stage],[data-note-del],[data-note-remind],[data-remind-save],[data-remind-clear],[data-remind-cancel],[data-qp],#close,#scrim,#csv,#theme,#refresh,#logout');
  if (!t) return;
  if (t.dataset.qp) { $('#note-remind').value = localInput(t.dataset.qp === 'hour' ? inAnHour() : tomorrowNine()); return; }
  if (t.dataset.noteRemind) { openReminderEdit(t.dataset.noteRemind); return; }
  if (t.dataset.remindCancel != null) { t.closest('.remind-edit').remove(); return; }
  if (t.dataset.remindSave || t.dataset.remindClear) {
    const id = Number(t.dataset.remindSave || t.dataset.remindClear);
    const v = t.dataset.remindSave ? t.closest('.remind-edit').querySelector('input').value : '';
    if (t.dataset.remindSave && !v) return;
    t.disabled = true;
    act('set_note_reminder', { lead_id: UI.openLead, note_id: id, remind_at: v ? new Date(v).toISOString() : null })
      .then((ok) => { t.disabled = false; if (ok) { toast(v ? 'Herinnering staat' : 'Herinnering weggehaald'); refreshNotes(); } });
    return;
  }
  if (t.dataset.noteDel) {
    // First click asks, the second (within 4 s) deletes.
    if (!t.classList.contains('confirm')) {
      t.classList.add('confirm'); t.textContent = 'Verwijderen?';
      setTimeout(() => { if (t.isConnected) { t.classList.remove('confirm'); t.innerHTML = icon('x'); } }, 4000);
      return;
    }
    t.disabled = true;
    act('delete_note', { lead_id: UI.openLead, note_id: Number(t.dataset.noteDel) }).then((ok) => { if (ok) { toast('Notitie verwijderd'); refreshNotes(); } });
    return;
  }
  if (t.dataset.copy != null) { e.stopPropagation(); copy(t.dataset.copy, t.dataset.what || 'Tekst'); return; }
  if (t.dataset.lead) { openLead(t.dataset.lead); return; }
  if (t.dataset.stage != null) { UI.stage = t.dataset.stage || null; history.replaceState(null, '', `#leads${UI.stage ? '/' + UI.stage : ''}`); renderLeads(); return; }
  if (t.id === 'close' || t.id === 'scrim') closeLead();
  if (t.id === 'csv') exportCSV();
  if (t.id === 'theme') toggleTheme();
  if (t.id === 'refresh') { load().then(() => toast('Bijgewerkt')); }
  if (t.id === 'logout') { sb.auth.signOut().finally(() => location.reload()); }
});
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'note-form') return;
  e.preventDefault();
  const box = $('#note-text'), btn = $('#note-add'), text = box.value.trim(), remind = $('#note-remind').value;
  if (!text || !UI.openLead) return;
  btn.disabled = true; btn.textContent = 'Opslaan…';
  const ok = await act('add_note', { lead_id: UI.openLead, note: text, source: 'web', remind_at: remind ? new Date(remind).toISOString() : null });
  btn.disabled = false; btn.textContent = 'Toevoegen';
  if (ok) { toast(remind ? `Notitie opgeslagen · herinnering ${due(new Date(remind))}` : 'Notitie opgeslagen'); refreshNotes(); }
});
document.addEventListener('input', (e) => { if (e.target.id === 'q') { UI.q = e.target.value; renderLeads(); } });
document.addEventListener('change', (e) => { if (e.target.id === 'sort') { UI.sort = e.target.value; renderLeads(); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'note-text') { e.preventDefault(); $('#note-form').requestSubmit(); return; }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'prep-note-text') { e.preventDefault(); $('#prep-note-form').requestSubmit(); return; }
  if (e.key === 'Escape' && $('#intake').classList.contains('open')) { closeIntake(); return; }
  if (e.key === 'Escape' && $('#prep').classList.contains('open')) { closePrep(); return; }
  if (e.key === 'Escape' && UI.openLead && e.target.id !== 'note-text') closeLead();
  if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) { e.preventDefault(); location.hash = '#leads'; setTimeout(() => $('#q')?.focus(), 0); }
});
// Light / dark: starts from the system setting, the button flips it and the choice is remembered.
const isDark = () => document.documentElement.dataset.theme === 'dark' ||
  (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
function paintThemeButton() {
  const b = $('#theme');
  b.innerHTML = icon(isDark() ? 'sun' : 'moon');
  b.title = isDark() ? 'Lichte modus' : 'Donkere modus';
}
function toggleTheme() {
  const next = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('sw-theme', next); } catch {}
  paintThemeButton();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeButton);
paintThemeButton();
$('#refresh').innerHTML = icon('refresh');
$('#logout').innerHTML = icon('logout');

// ───────────── Auth + live updates ─────────────
let started = false;
let debounce;
function start() {
  if (started) return;
  started = true;
  $('#login').hidden = true; $('#app').hidden = false;
  load().then(route);
  if (!MOCK) {
    // Same as the app: any change to leads or tasks refreshes the screen.
    const again = () => { clearTimeout(debounce); debounce = setTimeout(load, 500); };
    sb.channel('sw-web').on('postgres_changes', { event: '*', schema: 'public', table: 'leads' }, again)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks' }, again).subscribe();
  }
  setInterval(() => { if (!document.hidden) load(); }, 60e3);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - (S.loadedAt || 0) > 20e3) load(); });
}

function showLogin(msg, err) {
  $('#app').hidden = true; $('#login').hidden = false;
  const m = $('#login-msg'); m.textContent = msg || ''; m.className = `login-msg${err ? ' err' : ''}`;
}

function showNoAccess() {
  $('#v-overzicht').innerHTML = `<div class="card empty">${icon('hand')}<b>Dit account heeft geen toegang</b>Log in met het adres van je Apple ID, hetzelfde als in de SW Leads-app.<br><br><button class="btn primary" id="logout">Uitloggen</button></div>`;
  for (const id of ['vandaag', 'leads', 'script']) $(`#v-${id}`).hidden = true;
  $('#v-overzicht').hidden = false;
}

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('#login-btn');
  btn.disabled = true; btn.textContent = 'Versturen…';
  const { data, error } = await sb.functions.invoke('web-login', { body: {} });
  btn.disabled = false; btn.textContent = 'Stuur inloglink';
  if (!error && data?.ok) { showLogin(`Check je mail (${data.to}) en klik op Inloggen. Dit tabblad mag dicht.`); return; }
  const code = await error?.context?.json?.().then((j) => j.error).catch(() => null);
  if (code === 'too_many') showLogin('Er is net al een link verstuurd. Kijk in je mail, of probeer het over een minuut opnieuw.', true);
  else showLogin('Versturen lukte niet. Probeer het zo nog eens.', true);
});

if (MOCK) {
  start();
} else {
  // The link from the login mail: #login=<token_hash>. Exchange it once, then drop it from the address bar.
  const tokenHash = new URLSearchParams(location.hash.slice(1)).get('login');
  if (tokenHash) {
    history.replaceState(null, '', location.pathname);
    showLogin('Inloggen…');
    sb.auth.verifyOtp({ token_hash: tokenHash, type: 'magiclink' }).then(({ error }) => {
      if (error) showLogin('Deze link werkt niet meer (al gebruikt of verlopen). Vraag een nieuwe aan.', true);
    });
  }
  sb.auth.onAuthStateChange((event, session) => {
    // Never call Supabase inside this callback (auth lock): start on the next tick.
    if (session) setTimeout(start, 0);
    else if (!tokenHash && (event === 'SIGNED_OUT' || event === 'INITIAL_SESSION')) showLogin('');
  });
}
</script>
